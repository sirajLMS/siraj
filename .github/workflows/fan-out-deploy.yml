# ============================================================
# Fan-Out Deploy Workflow
# ============================================================
#
# PURPOSE:
#   Syncs the `prod` branch to multiple "ambassador branches",
#   each with a rewritten commit author email. This allows
#   multiple Vercel accounts (each linked to a different GitHub
#   account) to deploy from the same codebase.
#
# HOW IT WORKS:
#   1. A push to `prod` OR a manual trigger fires this workflow.
#   2. The workflow fetches origin/prod and each ambassador branch.
#   3. It compares their *tree SHAs* (file content, not commit SHA).
#      If the trees are identical the branch is already up to date
#      and the sync is skipped -- no unnecessary Vercel deployment.
#   4. For each branch that IS behind, the workflow:
#      a. Resets the ambassador branch to origin/prod.
#      b. Amends the top commit author to the target email.
#      c. Force-pushes -> Vercel webhook fires -> deployment runs.
#
# TRIGGERS:
#   - push to `prod`   : automatic, fires on every new prod commit.
#   - workflow_dispatch: manual "Run workflow" button in GitHub UI.
#                        Always runs against prod regardless of
#                        which branch you select in the UI dropdown.
#
# WHY COMPARE TREE SHAs?
#   After amending the commit author the commit SHA changes, but
#   the tree SHA (file content fingerprint) stays the same.
#   Comparing trees lets us detect "already synced" reliably even
#   after author rewrites.
#
# WHY AMEND THE COMMIT AUTHOR?
#   Vercel's GitHub integration verifies that the push comes from
#   the GitHub account linked to the Vercel project.
#   Rewriting the commit author to the linked email satisfies this.
#
# ============================================================
# SETUP CHECKLIST (do this once before using):
# ============================================================
#
# 1. CREATE A PERSONAL ACCESS TOKEN (PAT):
#    - Go to: https://github.com/settings/tokens/new
#      (logged in as ahmedhosnypro)
#    - Note: siraj-deploy-pat
#    - Expiration: No expiration (or 1 year)
#    - Scopes: check "repo" (top-level -- includes all sub-scopes)
#    - Click "Generate token" and copy it immediately.
#    - Store as a repo secret named: DEPLOY_PAT
#      https://github.com/ahmedhosnypro/siraj/settings/secrets/actions/new
#
# 2. VERCEL ACCOUNT SETUP (per ambassador account):
#    a. Log in to the target Vercel account.
#    b. Import the GitHub repository (ahmedhosnypro/siraj).
#    c. Vercel project settings -> Git -> Production Branch:
#         - Account mfdfdfo            -> deploy/mfdfdfo
#         - Account ahmedhosnyspace3   -> deploy/ahmedhosnyspace3-stack
#    d. Optionally disable "Preview Deployments" to reduce noise.
#
# 3. AMBASSADOR BRANCHES (already created):
#      - deploy/mfdfdfo                (ahmedhosnyspace@gmail.com)
#      - deploy/ahmedhosnyspace3-stack (ahmedhosnyspace3@gmail.com)
#    The `prod` branch itself serves Account 1 (ahmedhosnypro).
#
# ============================================================

on:
  # Auto-trigger: fires whenever a commit is pushed to prod.
  push:
    branches: [prod]

  # Manual trigger: shows a "Run workflow" button in the GitHub UI.
  # Go to: Actions tab -> Fan-Out Deploy -> Run workflow (top right).
  # IMPORTANT: The branch dropdown in the UI is cosmetic here --
  # the workflow always syncs from origin/prod, never from master
  # or any other branch. Selecting a different branch in the dropdown
  # only changes which branch the workflow YAML is read from, not
  # the source of the sync.
  workflow_dispatch:

jobs:
  fan-out-deploy:
    name: "Sync prod -> ${{ matrix.branch }}"
    runs-on: ubuntu-latest

    strategy:
      # Run each ambassador branch independently.
      # A failure for one account does not cancel the others.
      fail-fast: false
      matrix:
        include:
          # ----------------------------------------------------------
          # Account 2: mfdfdfo
          # Vercel account email: ahmedhosnyspace@gmail.com
          # GitHub username:      mfdfdfo
          # Ambassador branch:    deploy/mfdfdfo
          # ----------------------------------------------------------
          - branch: deploy/mfdfdfo
            email: ahmedhosnyspace@gmail.com
            name: mfdfdfo

          # ----------------------------------------------------------
          # Account 3: ahmedhosnyspace3-stack
          # Vercel account email: ahmedhosnyspace3@gmail.com
          # GitHub username:      ahmedhosnyspace3-stack
          # Ambassador branch:    deploy/ahmedhosnyspace3-stack
          # ----------------------------------------------------------
          - branch: deploy/ahmedhosnyspace3-stack
            email: ahmedhosnyspace3@gmail.com
            name: ahmedhosnyspace3-stack

    steps:
      - name: Checkout prod branch
        uses: actions/checkout@v4
        with:
          # Always sync FROM prod -- never master or the branch
          # selected in the workflow_dispatch UI dropdown.
          ref: prod
          fetch-depth: 0
          # PAT required: GITHUB_TOKEN cannot trigger Vercel's
          # GitHub App webhook or push to protected branches.
          token: ${{ secrets.DEPLOY_PAT }}

      - name: Fetch ambassador branch
        # Fetch the current state of the ambassador branch so we
        # can compare its tree against prod below.
        run: |
          git fetch origin "${{ matrix.branch }}" || true
          # "|| true" handles the case where the branch doesn't
          # exist yet on the remote (first run).

      - name: Check if sync is needed
        id: check
        # Compare the tree SHA of prod HEAD vs the ambassador branch HEAD.
        # Tree SHA = fingerprint of file content only (ignores metadata).
        # If trees match, prod content is already live on this branch.
        # If trees differ, prod has new commits that need to be synced.
        run: |
          PROD_TREE=$(git rev-parse origin/prod^{tree})

          # Try to get the ambassador branch tree; default to "none"
          # if the branch doesn't exist yet.
          DEPLOY_TREE=$(git rev-parse "origin/${{ matrix.branch }}^{tree}" 2>/dev/null || echo "none")

          echo "prod tree:   $PROD_TREE"
          echo "deploy tree: $DEPLOY_TREE"

          if [ "$PROD_TREE" = "$DEPLOY_TREE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No new commits on prod -- ambassador branch is already up to date. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New commits detected on prod -- sync required."
          fi

      - name: Configure git identity
        if: steps.check.outputs.skip == 'false'
        # Set the author identity to the target account's email.
        # This is what Vercel checks against the linked GitHub account.
        run: |
          git config user.email "${{ matrix.email }}"
          git config user.name "${{ matrix.name }}"

      - name: Reset ambassador branch to prod
        if: steps.check.outputs.skip == 'false'
        # Force-reset the ambassador branch to exactly match prod.
        # This is always a clean mirror -- no divergence ever.
        run: |
          git checkout -B "${{ matrix.branch }}" origin/prod

      - name: Rewrite top commit author
        if: steps.check.outputs.skip == 'false'
        # Amend only the commit metadata (author name + email).
        # File content (tree) is untouched -- same code as prod.
        # --reset-author applies the git config set above.
        # --no-edit keeps the original commit message intact.
        run: |
          git commit --amend --reset-author --no-edit

      - name: Force-push ambassador branch
        if: steps.check.outputs.skip == 'false'
        # Force push because the commit SHA changed after --amend.
        # Vercel's GitHub App webhook fires on any push event,
        # including force pushes -- this triggers the deployment.
        run: |
          git push --force origin "${{ matrix.branch }}"

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            echo "SKIPPED: ${{ matrix.branch }} is already up to date with prod."
          else
            echo "SYNCED:  prod -> ${{ matrix.branch }} (author: ${{ matrix.email }})"
          fi
