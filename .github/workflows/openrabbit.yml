name: OpenRabbit Reviewer

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: openrabbit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Pull Request Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Shell NVIDIA Router
        env:
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          NVIDIA_API_KEYS_2: ${{ secrets.NVIDIA_API_KEYS_2 }}
          NVIDIA_API_KEYS_3: ${{ secrets.NVIDIA_API_KEYS_3 }}
          ROUTER_PORT: 20128
          COOLDOWN_SEC: 60
        run: |
          chmod +x .github/scripts/router/*.sh .github/scripts/nvidia-router.sh
          .github/scripts/nvidia-router.sh start

      - name: OpenRabbit Review
        uses: aryanbrite/openrabbit@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_provider: openrouter
          llm_api_url: http://127.0.0.1:20128/v1
          llm_api_key: "local-proxy"
          llm_model: "nvidia/z-ai/glm-5.2"
          review_mode: both
          tone_mode: balanced

      - name: Stop Shell NVIDIA Router
        if: always()
        env:
          ROUTER_PORT: 20128
        run: |
          .github/scripts/nvidia-router.sh stop || true
