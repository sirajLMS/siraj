name: Production Database Migration

on:
  push:
    branches:
      - master

# Avoid overlapping migration runs on rapid pushes.
concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate Neon production database
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Baseline drizzle migration journal
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ENCRYPTION_KEY: ${{ secrets.DATABASE_ENCRYPTION_KEY }}
          DB_PROVIDER: neon
          NODE_ENV: development
        run: bun run scripts/baseline-drizzle-migrations.ts

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ENCRYPTION_KEY: ${{ secrets.DATABASE_ENCRYPTION_KEY }}
          DB_PROVIDER: neon
          NODE_ENV: development
        run: bun run backend/db/scripts/migrate.ts
