# ============================================================
# GraphQL Integration Tests Workflow
# ============================================================
#
# PURPOSE:
#   Dedicated CI workflow for running GraphQL integration tests against
#   a production test server (TEST_SERVER_MODE=production) with PostgreSQL.
#
# SEPARATION RATIONALE:
#   GraphQL tests require building the Next.js production bundle (.next-test-prod)
#   and running a spawned Next.js server instance. Separating this from the
#   main CI workflow allows:
#     1. Faster main CI (db + services tests do not need next build)
#     2. Parallel CI execution between DB/service tests and GraphQL tests
#     3. Isolated failures and easier retries
#
# DATABASE_URL policy: never use secrets.DATABASE_URL in this workflow.
# Always use the job Postgres service below (siraj_test).
#
# Seed policy: CI must NEVER run database seeds (drizzleSeed.ts, `bun db seed`).
# Migrations supply schema + migration-bundled reference data only.

name: 🔷 GraphQL Tests

on:
  pull_request:
    branches: [master, prod]

concurrency:
  group: graphql-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphql-tests:
    name: 🌐 GraphQL Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: siraj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      HUSKY: "0"
      # Core database / auth (required for build, migrate, and tests)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/siraj_test?sslmode=disable
      DATABASE_ENCRYPTION_KEY: ${{ secrets.DATABASE_ENCRYPTION_KEY || 'development-database-encryption-key-must-be-changed-in-production' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret-not-used-in-ci-but-must-be-non-empty-32-chars' }}
      DB_PROVIDER: postgres
      # App config required at build/runtime validation
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@siraj.com' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER || 'local' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || 'your-secret-key-here-must-be-some-secret-key-32-chars' }}
      CACHE_PROVIDER: ${{ secrets.CACHE_PROVIDER || 'postgres' }}
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      ALLOWED_ORIGIN: http://localhost:3000
      LOCAL_STORAGE_PATH: ./storage/
      # Demo / test-server flags (GraphQL + production test server harness)
      IS_DEMO: "true"
      NEXT_PUBLIC_IS_DEMO: "true"
      AUTH_COOKIE_SECURE: "false"
      # Test runner (migrate-only DB — no seeds; tests provision their own data)
      NODE_ENV: test
      # Test harness: keep job DATABASE_URL when spawning bun test workers
      TEST_CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.ADMIN_PASSWORD }}" ]; then
            echo "::error::ADMIN_PASSWORD secret is missing — refusing to run with a committed fallback credential"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-pkgs-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-pkgs-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .next-test-prod/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Next.js test production build
        env:
          NEXT_DEBUG_PRERENDER: "1"
        run: bun run build:test

      # Migrate-only: do NOT run drizzleSeed.ts or any seed step here.
      - name: Prepare database
        run: bun run backend/db/scripts/migrate.ts

      - name: GraphQL integration tests
        env:
          TEST_SERVER_MODE: production
          # Harness sets TEST_SERVER=1 on the spawned `next start` process; explicit here documents CI intent.
          TEST_SERVER: "1"
        run: bun run test:graphql
