# ============================================================
# Fork Sync Deploy Workflow
# ============================================================
#
# PURPOSE:
#   Syncs the `prod` branch of THIS (source) repo into each
#   account's personal fork, using THAT account's own PAT to
#   push. Because the push is authenticated as the fork owner,
#   Vercel's GitHub App sees it as a legitimate push from the
#   linked account and triggers a deployment.
#
# WHY FORKS, NOT AMBASSADOR BRANCHES?
#   The ambassador-branch approach (rewriting the commit author
#   and force-pushing within the same repo) does NOT work because
#   Vercel checks the AUTHENTICATED PUSHER (the GitHub account
#   whose token made the API call), not the git commit author
#   metadata. Rewriting the author email is cosmetic -- Vercel
#   still sees the push came from ahmedhosnypro's token.
#
#   With the fork approach, each account uses THEIR OWN PAT to
#   push to THEIR OWN fork. GitHub authenticates the push as
#   that account, so Vercel's GitHub App correctly identifies
#   the pusher and triggers the deployment.
#
# ARCHITECTURE:
#
#   [sirajLMS/siraj] -- prod push -->  GH Actions
#                                                |
#                   +--------------+--------------+--------------+
#                   |              |              |
#         FORK_PAT_AHMEDHOSNYPRO   FORK_PAT_MFDFDFO   FORK_PAT_AHMEDHOSNYSPACE3
#                   |              |              |
#         push as ahmedhosnypro  push as mfdfdfo  push as ahmedhosnyspace3-stack
#                   |              |              |
#     [ahmedhosnypro/siraj]   [mfdfdfo/siraj]  [ahmedhosnyspace3-stack/siraj]
#         -> Vercel A            -> Vercel B        -> Vercel C
#
# SMART SKIP:
#   Before syncing, the workflow compares the tree SHA of prod
#   HEAD vs the fork's target branch HEAD. If they match (same
#   file content), the fork is already up to date and the push
#   is skipped -- no unnecessary Vercel deployment is triggered.
#
# ============================================================
# SETUP CHECKLIST (do this once before using):
# ============================================================
#
# STEP 1 -- FORK THE REPO (each account does this once):
#
#   Account ahmedhosnypro (ahhosnyas@gmail.com):
#     - Log in as ahmedhosnypro on GitHub
#     - Go to https://github.com/sirajLMS/siraj
#     - Click "Fork" -> Create fork under ahmedhosnypro account
#     - The fork URL will be: https://github.com/ahmedhosnypro/siraj
#
#   Account mfdfdfo (ahmedhosnyspace@gmail.com):
#     - Log in as mfdfdfo on GitHub
#     - Go to https://github.com/sirajLMS/siraj
#     - Click "Fork" -> Create fork under mfdfdfo account
#     - The fork URL will be: https://github.com/mfdfdfo/siraj
#
#   Account ahmedhosnyspace3-stack (ahmedhosnyspace3@gmail.com):
#     - Log in as ahmedhosnyspace3-stack on GitHub
#     - Go to https://github.com/sirajLMS/siraj
#     - Click "Fork" -> Create fork under ahmedhosnyspace3-stack account
#     - The fork URL will be: https://github.com/ahmedhosnyspace3-stack/siraj
#
# STEP 2 -- CREATE A PAT FOR EACH FORK OWNER:
#
#   For ahmedhosnypro:
#     - Log in as ahmedhosnypro on GitHub
#     - Go to: https://github.com/settings/tokens/new
#     - Note: siraj-fork-sync
#     - Expiration: No expiration (or 1 year)
#     - Scopes: check "repo" (top-level)
#     - Generate and COPY the token
#
#   For mfdfdfo:
#     - Same steps, logged in as mfdfdfo
#
#   For ahmedhosnyspace3-stack:
#     - Same steps, logged in as ahmedhosnyspace3-stack
#
# STEP 3 -- ADD PATS AS SECRETS IN THIS (SOURCE) REPO:
#
#   Go to: https://github.com/sirajLMS/siraj/settings/secrets/actions
#
#   Add three secrets:
#     Name: FORK_PAT_AHMEDHOSNYPRO
#     Value: <PAT generated by ahmedhosnypro in Step 2>
#
#     Name: FORK_PAT_MFDFDFO
#     Value: <PAT generated by mfdfdfo in Step 2>
#
#     Name: FORK_PAT_AHMEDHOSNYSPACE3
#     Value: <PAT generated by ahmedhosnyspace3-stack in Step 2>
#
# STEP 4 -- CONNECT EACH FORK TO VERCEL:
#
#   For Vercel account linked to ahmedhosnypro:
#     - Log in to Vercel as the ahmedhosnypro account
#     - Add New Project -> Import Git Repository
#     - Select the fork: ahmedhosnypro/siraj
#     - Production Branch: prod
#     - Deploy
#
#   For Vercel account linked to mfdfdfo:
#     - Same steps for mfdfdfo/siraj
#     - Production Branch: prod
#
#   For Vercel account linked to ahmedhosnyspace3-stack:
#     - Same steps for ahmedhosnyspace3-stack/siraj
#     - Production Branch: prod
#
# STEP 5 -- VERIFY:
#   Push a commit to prod in this repo.
#   All three forks should receive the push and Vercel should deploy.
#
# ============================================================

name: Sync Forks & Deploy

on:
  # Auto-trigger: fires on every commit pushed to prod ONLY.
  push:
    branches: [prod]

  # Manual trigger: "Run workflow" button in GitHub Actions UI.
  workflow_dispatch:

jobs:
  sync-to-fork:
    name: "Sync prod -> ${{ matrix.fork_owner }}/siraj"
    runs-on: ubuntu-latest

    strategy:
      # Each fork syncs independently -- one failure does not
      # cancel the other.
      fail-fast: false
      matrix:
        include:
          # ----------------------------------------------------------
          # Fork 1: ahmedhosnypro
          # Vercel account email: ahhosnyas@gmail.com
          # Fork URL:             https://github.com/ahmedhosnypro/siraj
          # PAT secret:           FORK_PAT_AHMEDHOSNYPRO
          #   (generated by ahmedhosnypro, stored in sirajLMS/siraj secrets)
          # ----------------------------------------------------------
          - fork_owner: ahmedhosnypro
            fork_repo: siraj
            email: ahhosnyas@gmail.com
            pat_secret: FORK_PAT_AHMEDHOSNYPRO

          # ----------------------------------------------------------
          # Fork 2: mfdfdfo
          # Vercel account email: ahmedhosnyspace@gmail.com
          # Fork URL:             https://github.com/mfdfdfo/siraj
          # PAT secret:           FORK_PAT_MFDFDFO
          #   (generated by mfdfdfo, stored in sirajLMS/siraj secrets)
          # ----------------------------------------------------------
          - fork_owner: mfdfdfo
            fork_repo: siraj
            email: ahmedhosnyspace@gmail.com
            pat_secret: FORK_PAT_MFDFDFO

          # ----------------------------------------------------------
          # Fork 3: ahmedhosnyspace3-stack
          # Vercel account email: ahmedhosnyspace3@gmail.com
          # Fork URL:             https://github.com/ahmedhosnyspace3-stack/siraj
          # PAT secret:           FORK_PAT_AHMEDHOSNYSPACE3
          #   (generated by ahmedhosnyspace3-stack, stored in sirajLMS/siraj secrets)
          # ----------------------------------------------------------
          - fork_owner: ahmedhosnyspace3-stack
            fork_repo: siraj
            email: ahmedhosnyspace3@gmail.com
            pat_secret: FORK_PAT_AHMEDHOSNYSPACE3

    steps:
      - name: Checkout prod branch (source repo)
        uses: actions/checkout@v4
        with:
          # Always sync FROM prod -- the branch dropdown in the
          # workflow_dispatch UI does not affect this.
          ref: prod
          fetch-depth: 0
          # Use the fork owner's PAT so GitHub attributes the
          # push to their account, not to ahmedhosnypro.
          token: ${{ secrets[matrix.pat_secret] }}

      - name: Add fork as remote
        # Point git at the fork repo using the fork owner's PAT.
        # The PAT is embedded in the URL for authentication.
        # Using the matrix PAT secret here is what makes GitHub
        # attribute the subsequent push to the fork owner's account.
        run: |
          git remote add fork \
            "https://x-access-token:${{ secrets[matrix.pat_secret] }}@github.com/${{ matrix.fork_owner }}/${{ matrix.fork_repo }}.git"

      - name: Fetch fork prod branch
        # Fetch the fork's prod branch state to compare trees.
        # "|| true" handles the case where the branch doesn't exist
        # yet or has no commits (first run).
        run: |
          git fetch fork refs/heads/prod:refs/remotes/fork/prod || true

      - name: Check if sync is needed
        id: check
        # Compare the tree SHA (file-content fingerprint) of prod
        # vs the fork's prod branch. If they match, content is identical
        # and no sync or Vercel deployment is needed.
        run: |
          PROD_TREE=$(git rev-parse origin/prod^{tree})
          FORK_TREE=$(git rev-parse refs/remotes/fork/prod^{tree} 2>/dev/null || echo "none")

          echo "prod tree: $PROD_TREE"
          echo "fork tree: $FORK_TREE"

          if [ "$PROD_TREE" = "$FORK_TREE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Fork ${{ matrix.fork_owner }}/${{ matrix.fork_repo }} is already up to date. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New commits detected. Syncing to ${{ matrix.fork_owner }}/${{ matrix.fork_repo }}."
          fi

      - name: Configure git identity
        if: steps.check.outputs.skip == 'false'
        # Set the author identity to the target fork owner's email & name.
        run: |
          git config user.email "${{ matrix.email }}"
          git config user.name "${{ matrix.fork_owner }}"

      - name: Rewrite top commit author
        if: steps.check.outputs.skip == 'false'
        # Amend top commit author metadata to match the fork owner.
        # --reset-author uses the git config set above.
        # --no-edit keeps original commit message intact.
        run: |
          git commit --amend --reset-author --no-edit

      - name: Push prod to fork
        if: steps.check.outputs.skip == 'false'
        # Force-push to the fork's `prod` branch.
        # Uses the fork owner's PAT and rewritten author email.
        run: |
          git push --force fork "HEAD:refs/heads/prod"

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            echo "SKIPPED: ${{ matrix.fork_owner }}/${{ matrix.fork_repo }} already matches prod."
          else
            echo "SYNCED:  prod -> ${{ matrix.fork_owner }}/${{ matrix.fork_repo }} (pusher: ${{ matrix.email }})"
          fi
