# ============================================================
# Fork Sync (source → forks). Builds happen on each fork via
# `.github/workflows/vercel-prebuilt.yml` — Vercel never builds.
# ============================================================
#
# PURPOSE:
#   Sync the `prod` branch of THIS (source) repo into each account's
#   personal fork, using THAT account's own PAT to push. The fork
#   push triggers `vercel-prebuilt.yml` on the fork, which builds on
#   GitHub Actions and deploys with `vercel deploy --prebuilt`.
#
# WHY FORKS?
#   Vercel projects are tied to each account's fork. We still sync
#   source → forks so each tenant gets the same tree; deployment is
#   no longer "Vercel Git saw a push and built" — it is
#   "fork GHA built + uploaded prebuilt artifacts".
#
# ARCHITECTURE:
#
#   [sirajLMS/siraj] -- prod push -->  GH Actions (this workflow)
#                                                |
#                   +--------------+--------------+--------------+
#                   |              |              |
#         FORK_PAT_* secrets (source repo) push to each fork's prod
#                   |              |              |
#     [ahmedhosnypro/siraj]   [mfdfdfo/siraj]  [ahmedhosnyspace3-stack/siraj]
#                   |              |              |
#         vercel-prebuilt.yml on EACH fork (secrets on that fork):
#           VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID
#                   |              |              |
#              Vercel A         Vercel B         Vercel C
#              (host only — ignoreCommand exits 0 for Git builds)
#
# SMART SKIP:
#   Before syncing, compare tree SHA of prod HEAD vs the fork's prod
#   HEAD. Matching trees skip the push (no unnecessary fork GHA run).
#
# ============================================================
# SETUP CHECKLIST (do this once before using):
# ============================================================
#
# STEP 1 -- FORK THE REPO (each account, once):
#   Fork https://github.com/sirajLMS/siraj under:
#     ahmedhosnypro / mfdfdfo / ahmedhosnyspace3-stack
#
# STEP 2 -- PATS ON SOURCE REPO (sirajLMS/siraj Actions secrets):
#   FORK_PAT_AHMEDHOSNYPRO / FORK_PAT_MFDFDFO / FORK_PAT_AHMEDHOSNYSPACE3
#   Each PAT: repo scope, generated by that fork owner.
#
# STEP 3 -- VERCEL SECRETS ON EACH FORK (not on source):
#   On ahmedhosnypro/siraj, mfdfdfo/siraj, ahmedhosnyspace3-stack/siraj:
#     Settings → Secrets and variables → Actions → New repository secret
#       VERCEL_TOKEN
#       VERCEL_ORG_ID
#       VERCEL_PROJECT_ID
#   Get orgId/projectId: `vercel link` then `cat .vercel/project.json`
#   Token: https://vercel.com/account/tokens
#
# STEP 4 -- VERCEL PROJECT SETTINGS (each project, once):
#   - Connect the *fork* as the Git repository (optional for dashboard)
#   - Production Branch: prod
#   - Build & Deployment → Ignored Build Step → "Don't build anything"
#     (vercel.json also sets ignoreCommand: "exit 0")
#
# STEP 5 -- ENABLE ACTIONS ON EACH FORK:
#   Fork Settings → Actions → General → allow Actions / allow all actions
#
# STEP 6 -- VERIFY:
#   Push to prod on sirajLMS/siraj → forks sync → each fork runs
#   "Vercel Prebuilt Deploy" → Vercel shows a deployment with no build logs.
#
# ============================================================

name: 🚀 Sync Forks & Deploy

on:
  # Auto-trigger: fires on every commit pushed to prod ONLY.
  push:
    branches: [prod]

  # Manual trigger: "Run workflow" button in GitHub Actions UI.
  workflow_dispatch:

jobs:
  typecheck:
    name: "🔍 Type Check (tsgo)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      HUSKY: "0"

    steps:
      - name: Checkout prod branch
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-pkgs-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-pkgs-${{ runner.os }}-

      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: |
            *.tsbuildinfo
            .next/cache/tsbuildinfo
          key: ts-build-info-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ts-build-info-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            ts-build-info-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (tsgo)
        run: bun run tsgo

  sync-to-fork:
    name: "🔄 Sync prod -> ${{ matrix.fork_owner }}/siraj"
    needs: [typecheck]
    runs-on: ubuntu-latest

    strategy:
      # Each fork syncs independently -- one failure does not
      # cancel the other.
      fail-fast: false
      matrix:
        include:
          # ----------------------------------------------------------
          # Fork 1: ahmedhosnypro
          # Vercel account email: ahmedhosnypro@gmail.com
          # Fork URL:             https://github.com/ahmedhosnypro/siraj
          # PAT secret:           FORK_PAT_AHMEDHOSNYPRO
          #   (generated by ahmedhosnypro, stored in sirajLMS/siraj secrets)
          # ----------------------------------------------------------
          - fork_owner: ahmed3820
            fork_repo: siraj
            email: ahmedhosnypro@gmail.com
            pat_secret: FORK_PAT_AHMED3820

          # ----------------------------------------------------------
          # Fork 2: mfdfdfo
          # Vercel account email: ahmedhosnyspace@gmail.com
          # Fork URL:             https://github.com/mfdfdfo/siraj
          # PAT secret:           FORK_PAT_MFDFDFO
          #   (generated by mfdfdfo, stored in sirajLMS/siraj secrets)
          # ----------------------------------------------------------
          - fork_owner: mfdfdfo
            fork_repo: siraj
            email: ahmedhosnyspace@gmail.com
            pat_secret: FORK_PAT_MFDFDFO

          # ----------------------------------------------------------
          # Fork 3: ahmedhosnyspace3-stack
          # Vercel account email: ahmedhosnyspace3@gmail.com
          # Fork URL:             https://github.com/ahmedhosnyspace3-stack/siraj
          # PAT secret:           FORK_PAT_AHMEDHOSNYSPACE3
          #   (generated by ahmedhosnyspace3-stack, stored in sirajLMS/siraj secrets)
          # ----------------------------------------------------------
          - fork_owner: ahmedhosnyspace3-stack
            fork_repo: siraj
            email: ahmedhosnyspace3@gmail.com
            pat_secret: FORK_PAT_AHMEDHOSNYSPACE3

    steps:
      - name: Checkout prod branch (source repo)
        uses: actions/checkout@v4
        with:
          # Always sync FROM prod -- the branch dropdown in the
          # workflow_dispatch UI does not affect this.
          ref: prod
          fetch-depth: 0
          # Use the fork owner's PAT so GitHub attributes the
          # push to their account, not to ahmedhosnypro.
          token: ${{ secrets[matrix.pat_secret] }}

      - name: Add fork as remote
        # Point git at the fork repo using the fork owner's PAT.
        # The PAT is embedded in the URL for authentication.
        # Using the matrix PAT secret here is what makes GitHub
        # attribute the subsequent push to the fork owner's account.
        run: |
          git remote add fork \
            "https://x-access-token:${{ secrets[matrix.pat_secret] }}@github.com/${{ matrix.fork_owner }}/${{ matrix.fork_repo }}.git"

      - name: Fetch fork prod branch
        # Fetch the fork's prod branch state to compare trees.
        # "|| true" handles the case where the branch doesn't exist
        # yet or has no commits (first run).
        run: |
          git fetch fork refs/heads/prod:refs/remotes/fork/prod || true

      - name: Check if sync is needed
        id: check
        # Compare the tree SHA (file-content fingerprint) of prod
        # vs the fork's prod branch. If they match, content is identical
        # and no sync or Vercel deployment is needed.
        run: |
          PROD_TREE=$(git rev-parse origin/prod^{tree})
          FORK_TREE=$(git rev-parse refs/remotes/fork/prod^{tree} 2>/dev/null || echo "none")

          echo "prod tree: $PROD_TREE"
          echo "fork tree: $FORK_TREE"

          if [ "$PROD_TREE" = "$FORK_TREE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Fork ${{ matrix.fork_owner }}/${{ matrix.fork_repo }} is already up to date. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New commits detected. Syncing to ${{ matrix.fork_owner }}/${{ matrix.fork_repo }}."
          fi

      - name: Configure git identity
        if: steps.check.outputs.skip == 'false'
        # Set the author identity to the target fork owner's email & name.
        run: |
          git config user.email "${{ matrix.email }}"
          git config user.name "${{ matrix.fork_owner }}"

      - name: Rewrite top commit author
        if: steps.check.outputs.skip == 'false'
        # Amend top commit author metadata to match the fork owner.
        # --reset-author uses the git config set above.
        # --no-edit keeps original commit message intact.
        run: |
          git commit --amend --reset-author --no-edit

      - name: Push prod to fork
        if: steps.check.outputs.skip == 'false'
        # Force-push to the fork's `prod` branch.
        # Uses the fork owner's PAT and rewritten author email.
        run: |
          git push --force fork "HEAD:refs/heads/prod"

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            echo "SKIPPED: ${{ matrix.fork_owner }}/${{ matrix.fork_repo }} already matches prod."
          else
            echo "SYNCED:  prod -> ${{ matrix.fork_owner }}/${{ matrix.fork_repo }} (pusher: ${{ matrix.email }})"
          fi
