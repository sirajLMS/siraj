# ============================================================
# Vercel Prebuilt Deploy (GitHub Actions builds; Vercel never builds)
# ============================================================
#
# PURPOSE:
#   Build Next.js on GitHub Actions (where we control Bun, CPU, and
#   timeouts), then upload `.vercel/output` with
#   `vercel deploy --prebuilt`. Vercel only hosts — it never runs
#   `bun install` / `next build`.
#
# WHERE IT RUNS:
#   On each *fork* when `prod` is pushed (or via workflow_dispatch).
#   The source repo `sirajLMS/siraj` only syncs forks via
#   `.github/workflows/deploy.yml`; this workflow is skipped there.
#
# FLOW:
#   sirajLMS/siraj prod push
#     → deploy.yml syncs tree to each fork's `prod`
#     → this workflow runs on the fork
#     → vercel pull → vercel build --prod → vercel deploy --prebuilt --prod
#
# SECRETS (add on EACH fork: Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        — Account token with deploy access
#                         https://vercel.com/account/tokens
#   VERCEL_ORG_ID       — Team/user id from `vercel link` / project settings
#   VERCEL_PROJECT_ID   — Project id from project settings
#
# How to get ORG_ID / PROJECT_ID (once per Vercel project):
#   vercel link
#   cat .vercel/project.json   # → orgId, projectId
#
# VERCEL SIDE (once per project — required):
#   1. Keep the Git repo connected (optional, for dashboard linkage)
#   2. Project Settings → Build & Deployment → Ignored Build Step
#      → "Don't build anything"  (REQUIRED — vercel.json is gitignored)
#   3. Production Branch: prod
#
# vercel.json is generated at prebuild with ignoreCommand/fluid/crons for
# the CLI build output; it is not committed.
# ============================================================

name: 🚀 Vercel Prebuilt Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: vercel-prebuilt-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy prebuilt → Vercel
    # Source repo only syncs forks; deploys happen on each fork with its own secrets.
    if: github.repository != 'sirajLMS/siraj'
    runs-on: ubuntu-latest
    # Vercel builders timed out at ~45m on 2-core; GHA needs headroom for tsc + next build.
    timeout-minutes: 90

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
      HUSKY: "0"
      # Match what Vercel would inject for a production build (prebuilt skips system envs).
      NEXT_PUBLIC_VERCEL_ENV: production
      VERCEL_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=0
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing secret VERCEL_TOKEN on ${{ github.repository }}"
            missing=1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Missing secret VERCEL_ORG_ID on ${{ github.repository }}"
            missing=1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing secret VERCEL_PROJECT_ID on ${{ github.repository }}"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add all three secrets under Settings → Secrets and variables → Actions on this fork."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-pkgs-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-pkgs-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: bun add --global vercel@latest

      - name: Pull Vercel production env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (GitHub Actions — not Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifacts
        id: deploy
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Summary
        run: |
          {
            echo "## Vercel prebuilt deploy"
            echo ""
            echo "- **Repo:** \`${{ github.repository }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **URL:** ${{ steps.deploy.outputs.url }}"
            echo "- **Build location:** GitHub Actions (Vercel Git builds ignored)"
          } >> "$GITHUB_STEP_SUMMARY"
