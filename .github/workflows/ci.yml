# CI workflow for build, type-check, format/lint (via Biome), and tests.
# NOTE: ESLint (`bun run lint`) is intentionally NOT run in CI. Per AGENTS.md,
# `bun run lint` is heavyweight and must go through the lint queue server
# (a local-only dev process). Lint runs in pre-commit hooks and the local
# `bun quality-gate` orchestration. Biome (which is concurrency-safe) IS
# run here as the CI-safe format/lint gate.
#
# Tests: ONLY `bun run test:db` and `bun run test:graphql` — never `bun test`
# or UI test scripts. UI tests run locally via `bun run test:ui`.
#
# `.env.test` is gitignored — CI has no file on disk. Job-level env below supplies
# all required vars. Set TEST_CI=true so test runners keep workflow DATABASE_URL
# (Postgres service) instead of clearing it before spawning workers. Locally,
# developers create `.env.test` from the "Test environment" section in .env.example.
#
# GraphQL tests in CI use `TEST_SERVER_MODE=production` (pre-built `next start`
# against `.next-test-prod`, same as UI E2E). Local `bun run test:graphql`
# keeps the default dev server unless TEST_SERVER_MODE is set explicitly.
#
# Test-helper GraphQL mutations (ensureDemoUsers, createTestEntities, etc.) are
# gated by `backend/lib/test-helper-gate.ts`. They register only when TEST_SERVER=1
# (set by the test harness on the spawned `next start` process), TEST_CI=true
# (job env below), or NODE_ENV is not production. They are hard-disabled when
# VERCEL_ENV=production — real production deploys must never set TEST_SERVER or TEST_CI.
# TODO(team): pin Bun version for reproducibility (currently unpinned).

#
# DATABASE_URL policy: never use secrets.DATABASE_URL in this workflow (or any
# test/build CI). Always use the job Postgres service below (siraj_test).
# The only workflow that may use secrets.DATABASE_URL is migrate-production.yml and deploy.yml.
#
# Seed policy: CI must NEVER run database seeds (drizzleSeed.ts, `bun db seed`, SEED_PROFILE,
# or equivalent). Migrations supply schema + migration-bundled reference data only; tests
# create their own fixtures. Do not add seed steps to this workflow without team approval.

name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: siraj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Core database / auth (required for build, migrate, and tests)
      # Local Postgres service only — never secrets.DATABASE_URL (see policy above).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/siraj_test?sslmode=disable
      DATABASE_ENCRYPTION_KEY: ${{ secrets.DATABASE_ENCRYPTION_KEY || 'development-database-encryption-key-must-be-changed-in-production' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret-not-used-in-ci-but-must-be-non-empty-32-chars' }}
      DB_PROVIDER: postgres
      # App config required at build/runtime validation
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@siraj.com' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || '12345678' }}
      STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER || 'local' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || 'your-secret-key-here-must-be-some-secret-key-32-chars' }}
      CACHE_PROVIDER: ${{ secrets.CACHE_PROVIDER || 'postgres' }}
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      ALLOWED_ORIGIN: http://localhost:3000
      LOCAL_STORAGE_PATH: ./storage/
      # Demo / test-server flags (GraphQL + production test server harness)
      IS_DEMO: "true"
      NEXT_PUBLIC_IS_DEMO: "true"
      AUTH_COOKIE_SECURE: "false"
      # Test runner (migrate-only DB — no seeds; tests provision their own data)
      NODE_ENV: test
      # Test harness: keep job DATABASE_URL when spawning bun test workers (see backend/lib/test-ci-env.ts).
      # Also enables test-helper GraphQL mutations as a secondary gate signal (see test-helper-gate.ts).
      TEST_CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"

      - name: Cache Bun & Next.js
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .next/cache
            .next-test-prod/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (tsgo)
        run: bun run tsgo

      - name: Biome lint + format
        run: bun run biome:check

      - name: Next.js test production build
        env:
          NEXT_DEBUG_PRERENDER: "1"
        run: bun run build:test

      # Migrate-only: do NOT run drizzleSeed.ts or any seed step here.
      # DB and GraphQL tests provision required data via test helpers (ensureDemoUsers,
      # createTestEntities, etc.) — they must not depend on bun db seed / SEED_PROFILE.
      - name: Prepare database
        run: bun run backend/db/scripts/migrate.ts

      - name: Database tests
        run: bun run test:db

      - name: GraphQL integration tests
        env:
          TEST_SERVER_MODE: production
          # Harness sets TEST_SERVER=1 on the spawned `next start` process; explicit here documents CI intent.
          TEST_SERVER: "1"
        run: bun run test:graphql
