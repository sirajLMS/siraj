[test]
timeout = 60000
coverageSkipTestFiles = true

# Backend DB tests: logger mock + env, NO happydom (no DOM needed)
[test.backend]
preload = ["./backend/db/test/logger-mock.ts", "./backend/db/test/ensure-env.ts"]
root = "backend/db/test/"

# GraphQL integration tests: logger mock + env, NO happydom (no DOM needed)
[test.graphql]
preload = ["./backend/db/test/logger-mock.ts", "./backend/db/test/ensure-env.ts"]
root = "frontend/graphql/test/"

# UI component tests: full preload including happydom (DOM emulation required)
[test.ui]
preload = ["./backend/db/test/logger-mock.ts", "./backend/db/test/ensure-env.ts", "./test/ui/components/happydom-preload.ts"]
root = "test/ui/"

