# ============================================================
# Siraj Agent Sandbox - Multi-Agent Docker Compose
# ============================================================
#
# node_modules are baked into the siraj-agent-base image.
# No named volumes needed for node_modules.
# Rebuild the image when package.json/bun.lock changes:
#   docker build -t siraj-agent-base -f .agent-sandbox/Dockerfile.agent .
#
# Start infrastructure only:
#   docker compose -f .agent-sandbox/docker-compose.agents.yml up -d postgres redis
#
# Start a specific agent (after running new-agent-sandbox.ps1):
#   docker compose -f .agent-sandbox/docker-compose.agents.yml up -d agent-1
#
# Stop everything:
#   docker compose -f .agent-sandbox/docker-compose.agents.yml down
#
# View logs:
#   docker compose -f .agent-sandbox/docker-compose.agents.yml logs -f agent-1
#
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: siraj_agent_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - siraj_agent_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: siraj
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - siraj-agent-net

  redis:
    image: redis:7-alpine
    container_name: siraj_agent_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - siraj_agent_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - siraj-agent-net

  # --------------------------------------------------------
  # Agent 1
  #   Dev:    localhost:3101
  #   Lint:   localhost:4877
  #   DB:     siraj_agent_1
  # --------------------------------------------------------
  agent-1: &agent-template
    image: siraj-agent-base
    build:
      context: .
      dockerfile: .agent-sandbox/Dockerfile.agent
    container_name: siraj-agent-1
    ports:
      - "3101:3000"
      - "4877:4777"
    volumes:
      - ../../worktrees/agent-1:/workspaces/siraj
      - ../..:/workspaces/siraj-git:ro
      - siraj-agent-1-modules:/workspaces/siraj/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/siraj_agent_1
      - REDIS_URL=redis://redis:6379
      - REDIS_PROVIDER=local
      - DB_PROVIDER=postgres
      - JWT_SECRET=agent-1-dev-jwt-secret-minimum-32-chars-change
      - DATABASE_ENCRYPTION_KEY=agent1-dev-encryption-key-must-be-very-long
      - STORAGE_PROVIDER=local
      - LOCAL_STORAGE_PATH=./storage/
      - NEXT_PUBLIC_BASE_URL=http://localhost:3101
      - ALLOWED_ORIGIN=http://localhost:3101
      - NEXT_PUBLIC_ENABLE_BINARY_GRAPHQL=true
      - GRAPHQL_ENCRYPTION_KEY=agent1-graphql-encryption-key-change
      - CACHE_PROVIDER=postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - siraj-agent-net

  # --------------------------------------------------------
  # Agent 2
  #   Dev:    localhost:3102
  #   Lint:   localhost:4878
  #   DB:     siraj_agent_2
  # --------------------------------------------------------
  agent-2:
    <<: *agent-template
    image: siraj-agent-base
    container_name: siraj-agent-2
    ports:
      - "3102:3000"
      - "4878:4777"
    volumes:
      - ../../worktrees/agent-2:/workspaces/siraj
      - ../..:/workspaces/siraj-git:ro
      - siraj-agent-2-modules:/workspaces/siraj/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/siraj_agent_2
      - REDIS_URL=redis://redis:6379
      - REDIS_PROVIDER=local
      - DB_PROVIDER=postgres
      - JWT_SECRET=agent-2-dev-jwt-secret-minimum-32-chars-change
      - DATABASE_ENCRYPTION_KEY=agent2-dev-encryption-key-must-be-very-long
      - STORAGE_PROVIDER=local
      - LOCAL_STORAGE_PATH=./storage/
      - NEXT_PUBLIC_BASE_URL=http://localhost:3102
      - ALLOWED_ORIGIN=http://localhost:3102
      - NEXT_PUBLIC_ENABLE_BINARY_GRAPHQL=true
      - GRAPHQL_ENCRYPTION_KEY=agent2-graphql-encryption-key-change
      - CACHE_PROVIDER=postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  siraj_agent_pgdata:
  siraj_agent_redisdata:
  siraj-agent-1-modules:
  siraj-agent-2-modules:

networks:
  siraj-agent-net:
    driver: bridge
