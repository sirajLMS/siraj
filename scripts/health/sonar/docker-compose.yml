services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-cad
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      # Tuning JVM for better performance within the 4GB limit
      # Current values were 512m, increasing to 1G for each component
      - SONAR_WEB_JAVAOPTS=-Xmx1G -Xms1G
      - SONAR_CE_JAVAOPTS=-Xmx1G -Xms1G
      - SONAR_SEARCH_JAVAOPTS=-Xmx1G -Xms1G
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonarnet

    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          memory: 2048M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  sonarnet:
    driver: bridge
