  metrics: TeacherDashboardMetrics
  progressFeed: [TeacherProgressFeedItem!]
  scheduleRows: [TeacherDashboardScheduleRow!]
}

type TeacherDashboardMetrics {
  absent: Int
  activated: Int
  advance: Int
  leave: Int
  pending: Int
  regular: Int
  rescheduled: Int
  running: Int
  suspended: Int
  taken: Int
  total: Int
  trial: Int
}

type TeacherDashboardScheduleRow {
  durationMinutes: Int
  executionState: String
  id: String
  outcome: String
  scheduledStartAt: DateTime
  studentId: String
  studentName: String
  yourTimeFormatted: String
  zoomMeetingUrl: String
}

type TeacherDirectory {
  id: String
  metrics: TeacherDirectoryMetrics
  rows: [TeacherDirectoryRow!]
  totalTeachers: Int
}

type TeacherDirectoryMetrics {
  activated: Int
  deactivated: Int
  id: String
}

type TeacherDirectoryRow {
  avatarUrl: String
  email: String
  id: String
  index: String
  name: String
  status: String
  zoomLink: String
}

type TeacherFutureSchedule {
  classes: [FutureClass!]
  id: String
  leaveQuotaTotal: Int
  leaveQuotaUsed: Int
  totalClasses: Int
}

type TeacherHandbookUrl {
  id: String
  url: String
}

type TeacherProfileResult {
  address: String
  dateOfBirth: String
  email: String
  gender: String
  hourlyRate: String
  id: String
  name: String
  nationalId: String
  phone: String
  qualifications: String
  rateCurrency: String
  skypeId: String
