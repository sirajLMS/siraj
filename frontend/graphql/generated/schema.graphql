  dailyScheduleMetrics(date: String!, teacherId: String): DailyScheduleMetrics
  directoryChildren(
    """Parent directory path (empty or null for root level)"""
    path: String
  ): [DirectoryInfo!]

  """
  Return effective permissions for a user, combining groups and overrides.
  """
  effectiveUserPermissions(userId: String!): [String!]
