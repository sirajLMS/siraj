type UnpaidInvoiceItem {
  currency: String
  id: String
  oldestDueDate: String
  overdueCount: Int
  totalUnpaidAmount: String
  userEmail: String
  userId: String
  userName: String
}

type UnpaidInvoicesSummary {
  id: String
  items: [UnpaidInvoiceItem!]
  totalOverdueAmount: String
  totalOverdueInvoices: Int
}

input UpdatePermissionGroupInput {
  description: String
  groupId: String!
  name: String
  permissionIds: [String!]
}

type UploadPreparation {
  id: String!
  uploadType: UploadType!
  url: String!
}

input UploadPreparationInput {
  contentHash: String!
  contentType: String!
  fileSize: Int!
  path: String!
}

enum UploadType {
  SIGNED_URL
  VERCEL_BLOB_CLIENT
}

type User {
  avatarUrl: String
  createdAt: DateTime
  email: String
  emailVerifiedAt: DateTime
  id: String
  name: String
  notificationCount: Int
  permissions: [AppPermission!]
  role: String
  updatedAt: DateTime
}

type UserOverride {
  assignedBy: String
  permissionId: String
  state: String
}

input UserOverrideInput {
  permissionId: String!
  state: String!
}

type WeeklyScheduleClass {
  day: String
