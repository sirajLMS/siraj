  reason: String!
}

input LoginInput {
  email: Email!
  password: String!
}

type LoginResponse {
  token: String
  user: User
}

type Mutation {
  activateClass(classInstanceId: ID!): ClassInstanceDetail
  activateOverrideClass(classInstanceId: ID!): ClassInstanceDetail
  copyStorageItems(input: StorageItemsCopyInput!): BulkOperationResult
  createFolder(input: FolderCreateInput!): FileOperationResult
  createTeacherManualClassEntry(input: CreateManualClassEntryInput!): ClassInstanceDetail
  deleteClassInstance(classInstanceId: ID!): Boolean
  deleteFile(path: String!): FileOperationResult
  deleteStorageItems(input: StorageItemsDeleteInput!): BulkOperationResult
  deleteStudent(id: String!): Student

  """
  Special GraphQL endpoint for demo fast login. It bypasses password checks and logs in a user using the provided permission group slug. Intended strictly for demonstration purposes and secured by environment variables.
  """
  demoLogin(input: DemoLoginInput!): LoginResponse
  logTeacherSupportRequest(input: LogSupportRequestInput!): SupportRequestResult
  login(input: LoginInput!): LoginResponse
  logout: Boolean
  moveStorageItems(input: StorageItemsMoveInput!): BulkOperationResult
  partiallyUpdateStudent(input: PartialStudentUpdateInput!): Student
  prepareUpload(input: UploadPreparationInput!): UploadPreparation
  refreshToken: RefreshTokenResponse
  renameFile(input: FileRenameInput!): FileOperationResult
  rescheduleClass(classInstanceId: ID!, input: RescheduleClassInput!): ClassInstanceDetail
  resetClass(classInstanceId: ID!): Boolean
  setStorageItemProtection(input: StorageItemProtectionUpdateInput!): FileOperationResult
  stopClass(classInstanceId: ID!): ClassInstanceDetail
  updateDirectoryPermissions(input: DirectoryPermissionsUpdateInput!): FileOperationResult
  updateSessionStatusAbsent(classInstanceId: ID!): ClassInstanceDetail
  updateSessionStatusLeave(classInstanceId: ID!, leaveReason: String!): LeaveProcessResult
  updateSessionStatusStart(classInstanceId: ID!): ClassInstanceDetail
}

enum OrderSortDirection {
  ASC
  DESC
}

