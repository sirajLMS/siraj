"""A type representing a validated phone number"""
scalar PhoneNumber

type Query {
  classInstance(id: ID!): ClassInstanceDetail
  classStatusEvents(classInstanceId: ID!): [ClassStatusEvent!]
  dailyScheduleList(date: String!, search: String, teacherId: String): [DailyScheduleList!]
  dailyScheduleMetrics(date: String!, teacherId: String): DailyScheduleMetrics
  directoryChildren(
    """Parent directory path (empty or null for root level)"""
    path: String
  ): [DirectoryInfo!]
  fileInfo(path: String!): FileInfo
  fileUsage(input: FileUsageCheckInput!): FileUsageResult
  folderInfo(path: String!): DirectoryInfo
  listFiles(input: FilesListInput!): StorageObjectList
  me: User
  searchFiles(
    """File type filter (optional)"""
    fileType: String

    """
    Folder to search in (optional, searches entire bucket if not specified)
    """
    folder: String

    """Maximum number of results"""
    limit: Int = 50
    searchTerm: String!
  ): StorageObjectList
  storageStats(
    """
    Folder path to get stats for (optional, gets stats for entire bucket if not specified)
    """
    path: String
  ): StorageStats
  student(id: String!): Student
  studentClassHistory(month: Int!, studentId: ID!, year: Int!): StudentClassHistory
  studentClassSessionDetail(classInstanceId: ID!): StudentSessionDetail
  students(filterArgs: StudentFilterArgs, orderBy: [StudentsOrderByClause!], paginationArgs: PaginationArgs): StudentsWithFiltersResponse!
  teacherActiveDashboard(date: String!): TeacherDashboard
  teacherDashboard(date: String!): TeacherDashboard
  teacherHandbookUrl: TeacherHandbookUrl
  teachers(limit: Int!, search: String!): [TeacherSimple!]
  translatedMessage(key: String!, namespace: String!): String
  user(id: String!): User
  users: [User!]
  welcomeMessage: String
}

