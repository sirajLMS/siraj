type DailyScheduleList {
  duration: Int
  id: String
  status: String
  student: DailyScheduleListUserItem
  studentTime: String
  teacher: DailyScheduleListUserItem
  yourTime: String
}

type DailyScheduleListUserItem {
  id: String
  name: String
}

type DailyScheduleMetrics {
  absent: Int
  activated: Int
  advance: Int
  id: String
  leave: Int
  pending: Int
  regular: Int
  rescheduled: Int
  running: Int
  suspended: Int
  taken: Int
  total: Int
  trial: Int
}

"""
A date string, such as 2007-12-03, compliant with the `full-date` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar Date

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

type DirectoryInfo implements StorageObject {
  createdAt: DateTime
  fileCount: Int
  folderCount: Int
  isFromBucket: Boolean
  isProtected: Boolean
  lastModified: DateTime
  name: String
  path: String!
  permissions: DirectoryPermissions
  protectChildren: Boolean
  totalSize: Int
}

type DirectoryPermissions {
  allowCreateSubDirs: Boolean
  allowDelete: Boolean
  allowDeleteFiles: Boolean
  allowMove: Boolean
  allowMoveFiles: Boolean
  allowUploads: Boolean
}

input DirectoryPermissionsInput {
  allowCreateSubDirs: Boolean!
  allowDelete: Boolean!
  allowDeleteFiles: Boolean!
  allowMove: Boolean!
  allowMoveFiles: Boolean!
  allowUploads: Boolean!
}

input DirectoryPermissionsUpdateInput {
  path: String!
  permissions: DirectoryPermissionsInput!
}

"""A type representing a validated email address"""
scalar Email

type FileInfo implements StorageObject {
  contentHash: String
  contentType: String
  createdAt: DateTime
  directoryPath: String
  fileType: FileType
  isFromBucket: Boolean
  isInUse: Boolean
  isProtected: Boolean
  isPublic: Boolean
  lastModified: DateTime
  mediaLink: String
  name: String
  path: String!
  size: Int!
  url: String!
  usages: [FileUsageInfo!]
}

type FileOperationResult {
  data: StorageObject
  message: String
  success: Boolean
}

input FileRenameInput {
  currentPath: String!
  newName: String!
}

enum FileSortField {
  CREATED
  MODIFIED
  NAME
  SIZE
  TYPE
}

enum FileType {
  ARCHIVE
  AUDIO
  DOCUMENT
  FONT
  IMAGE
  OTHER
  VIDEO
}

type FileTypeBreakdown {
  count: Int
  size: String
  type: FileType
}

input FileUsageCheckInput {
  path: String!
}

type FileUsageInfo {
  createdAt: DateTime
  filePath: String
  id: String
  referenceId: String
  referenceTable: String
  usageType: String
}

type FileUsageResult {
  canDelete: Boolean
  deleteBlockReason: String
  isInUse: Boolean
  usages: [FileUsageInfo!]
}

input FilesListInput {
  contentTypes: [String!]
  fileType: String
  fileTypes: [FileType!]
  includeDirectories: Boolean = true
  limit: Int
  offset: Int
  path: String!
  searchTerm: String
  sortBy: FileSortField
  sortDirection: OrderSortDirection
}

input FolderCreateInput {
  path: String!
  permissions: DirectoryPermissionsInput
  protectChildren: Boolean
  protected: Boolean
}

enum Gender {
  FEMALE
  MALE
}

"""A type representing arbitrary JSON values"""
scalar JSON

input LoginInput {
  email: Email!
  password: String!
}

type LoginResponse {
  token: String
  user: User
}

type Mutation {
  copyStorageItems(input: StorageItemsCopyInput!): BulkOperationResult
  createFolder(input: FolderCreateInput!): FileOperationResult
  deleteFile(path: String!): FileOperationResult
  deleteStorageItems(input: StorageItemsDeleteInput!): BulkOperationResult
  deleteStudent(id: String!): Student
  login(input: LoginInput!): LoginResponse
  logout: Boolean
  moveStorageItems(input: StorageItemsMoveInput!): BulkOperationResult
  partiallyUpdateStudent(input: PartialStudentUpdateInput!): Student
  prepareUpload(input: UploadPreparationInput!): UploadPreparation
  refreshToken: RefreshTokenResponse
  renameFile(input: FileRenameInput!): FileOperationResult
  setStorageItemProtection(input: StorageItemProtectionUpdateInput!): FileOperationResult
  updateDirectoryPermissions(input: DirectoryPermissionsUpdateInput!): FileOperationResult
}

enum OrderSortDirection {
  ASC
  DESC
}

type PageInfo {
  count: Int!
  currentPage: Int!
  endCursor: String
  firstItem: Int
  hasMorePages: Boolean!
  lastItem: Int
  lastPage: Int!
  perPage: Int!
  startCursor: String
  total: Int!
}

input PaginationArgs {
  after: String
  before: String
  first: Int = 10
  last: Int
  maxCount: Int = 100
  page: Int
  skip: Int
}

input PartialStudentUpdateInput {
  classesRemaining: Int
  classesTotal: Int
  dateOfBirth: DateTime
  gender: Gender
  id: String!
  language: AppLanguage
  name: String
  parentId: String
  primaryTeacherId: String
  status: StudentStatus
}

"""A type representing a validated phone number"""
scalar PhoneNumber

type Query {
  dailyScheduleList(date: String!, teacherId: String): [DailyScheduleList!]
  dailyScheduleMetrics(date: String!, teacherId: String): DailyScheduleMetrics
  directoryChildren(
    """Parent directory path (empty or null for root level)"""
    path: String
  ): [DirectoryInfo!]
  fileInfo(path: String!): FileInfo
  fileUsage(input: FileUsageCheckInput!): FileUsageResult
  folderInfo(path: String!): DirectoryInfo
  listFiles(input: FilesListInput!): StorageObjectList
  me: User
  searchFiles(
    """File type filter (optional)"""
    fileType: String

    """
    Folder to search in (optional, searches entire bucket if not specified)
    """
    folder: String

    """Maximum number of results"""
    limit: Int = 50
    searchTerm: String!
  ): StorageObjectList
  storageStats(
    """
    Folder path to get stats for (optional, gets stats for entire bucket if not specified)
    """
    path: String
  ): StorageStats
  student(id: String!): Student
  students(filterArgs: StudentFilterArgs, orderBy: [StudentsOrderByClause!], paginationArgs: PaginationArgs): StudentsWithFiltersResponse!
  translatedMessage(key: String!, namespace: String!): String
  user(id: String!): User
  users: [User!]
  welcomeMessage: String
}

type RefreshTokenResponse {
  token: String
  user: User
}

input StorageItemProtectionUpdateInput {
  isProtected: Boolean!
  path: String!
  protectChildren: Boolean
}

input StorageItemsCopyInput {
  destinationPath: String!
  sourcePaths: [String!]!
}

input StorageItemsDeleteInput {
  force: Boolean
  paths: [String!]!
}

input StorageItemsMoveInput {
  destinationPath: String!
  sourcePaths: [String!]!
}

interface StorageObject {
  isProtected: Boolean
  name: String
  path: String!
}

type StorageObjectList {
  hasMore: Boolean!
  items: [StorageObject!]
  limit: Int!
  offset: Int!
  totalCount: Int!
}

type StorageStats {
  directoryCount: Int
  fileTypeBreakdown: [FileTypeBreakdown!]
  totalFiles: Int
  totalSize: String
}

"""A map of string keys to string values (Record<string, string>)"""
scalar StringMap

type Student {
  classesRemaining: Int!
  classesTotal: Int!
  createdAt: DateTime
  dateOfBirth: DateTime
  gender: Gender
  id: String!
  language: AppLanguage
  name: String!
  parentId: String!
  primaryTeacherId: String
  status: StudentStatus!
  updatedAt: DateTime
}

input StudentCreateInput {
  classesRemaining: Int
  classesTotal: Int
  dateOfBirth: DateTime
  gender: Gender
  idempotencyKey: String!
  language: AppLanguage
  name: String!
  parentId: String!
  primaryTeacherId: String
  status: StudentStatus!
}

input StudentFilterArgs {
  birthDate: DateTime
  birthDateAfter: DateTime
  birthDateBefore: DateTime
  birthDateFrom: DateTime
  birthDateIsEmpty: Boolean
  birthDateIsNotEmpty: Boolean
  birthDateNot: DateTime
  birthDateOnOrAfter: DateTime
  birthDateOnOrBefore: DateTime
  birthDateTo: DateTime
  createdAt: DateTime
  createdAtAfter: DateTime
  createdAtBefore: DateTime
  createdAtFrom: DateTime
  createdAtIsEmpty: Boolean
  createdAtIsNotEmpty: Boolean
  createdAtNot: DateTime
  createdAtOnOrAfter: DateTime
  createdAtOnOrBefore: DateTime
  createdAtTo: DateTime
  gender: Gender
  language: AppLanguage
  name: String
  nameEndsWith: String
  nameEquals: String
  nameIsEmpty: Boolean
  nameIsNotEmpty: Boolean
  nameNotContains: String
  nameNotEquals: String
  nameStartsWith: String
  parentId: String
  primaryTeacherId: String
  status: StudentStatus
}

enum StudentStatus {
  DEACTIVATED
  GRADUATED
  ON_LEAVE
  ON_TRIAL
  REGULAR
  SUSPENDED
}

input StudentsOrderByClause {
  column: StudentsOrderByColumn!
  order: OrderSortDirection = ASC
}

enum StudentsOrderByColumn {
  CLASSES_REMAINING
  CLASSES_TOTAL
  CREATED_AT
  DATE_OF_BIRTH
  GENDER
  ID
  NAME
  PARENT_ID
  STATUS
  UPDATED_AT
}

type StudentsWithFiltersResponse {
  data: [Student!]!
  pageInfo: PageInfo!
}

type UploadPreparation {
  id: String!
  uploadType: UploadType!
  url: String!
}

input UploadPreparationInput {
  contentHash: String!
  contentType: String!
  fileSize: Int!
  path: String!
}

enum UploadType {
  SIGNED_URL
  VERCEL_BLOB_CLIENT
}

type User {
  avatarUrl: String
  createdAt: DateTime
  email: String
  emailVerifiedAt: DateTime
  id: String
  name: String
  notificationCount: Int
  permissions: [String!]
  role: String
  updatedAt: DateTime
}