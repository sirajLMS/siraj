sonar.projectKey=siraj_ui
sonar.projectName=Siraj_UI
sonar.projectVersion=1.0

# Source code
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Performance
sonar.javascript.node.maxspace=4096

# Exclusions
#   **/.*/**  — ignores ALL dot-directories anywhere in the tree (e.g. .next,
#               .scannerwork, .git, .agent, .ai, .storybook, ...). One pattern
#               replaces the previous hand-maintained list that missed new dot dirs.
sonar.exclusions=**/.*/**,**/messages/**,**theme/palette/**,docs/**,**/node_modules/**,**/dist/**,**/out/**,**/build/**,**/*.stories.@(js|jsx|ts|tsx),**/*.test.@(js|jsx|ts|tsx),**/__tests__/**,**/*.d.ts,**/public/**,**/coverage/**,**/scripts/**,**/mockData/**,**/decorators/**,**/graphql/generated/**

# TypeScript/JavaScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# SCM settings - scan working directory including uncommitted changes
sonar.scm.disabled=true

# Caching
sonar.analysisCache.enabled=true

sonar.issue.ignore.multicriteria=1

# Specify the rule you want to disable (RepositoryKey:RuleKey)
sonar.issue.ignore.multicriteria.1.ruleKey=typescript:S3358

# Apply the exclusion to all files in the project
sonar.issue.ignore.multicriteria.1.resourceKey=*