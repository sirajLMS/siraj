<!doctype html>
<html class="h-full" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      /* Custom scrollbar for better UX if needed */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #135e5e;
      }
    </style>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-container": "#586377",
              "navbar-teal": "#135E5E",
              "on-primary-fixed": "#002020",
              "on-error-container": "#93000a",
              "on-tertiary": "#ffffff",
              "surface-variant": "#e0e3e5",
              surface: "#f7f9fb",
              "on-tertiary-fixed-variant": "#005048",
              "surface-tint": "#2e6767",
              background: "#f7f9fb",
              "secondary-container": "#d5e0f8",
              "primary-container": "#0d4d4d",
              "on-background": "#191c1e",
              "error-container": "#ffdad6",
              "surface-container": "#eceef0",
              "on-primary-fixed-variant": "#104f4f",
              "inverse-surface": "#2d3133",
              "on-surface-variant": "#404848",
              "text-muted": "#64748B",
              "on-secondary-fixed-variant": "#3c475a",
              "on-tertiary-fixed": "#00201c",
              "on-error": "#ffffff",
              "on-tertiary-container": "#33c7b4",
              "on-primary": "#ffffff",
              outline: "#707978",
              error: "#ba1a1a",
              "tertiary-fixed-dim": "#4fdbc8",
              "surface-dim": "#d8dadc",
              "surface-container-low": "#f2f4f6",
              "surface-container-highest": "#e0e3e5",
              "border-subtle": "#E2E8F0",
              "on-secondary": "#ffffff",
              "on-primary-container": "#85bdbc",
              "tertiary-fixed": "#71f8e4",
              tertiary: "#00352f",
              "inverse-primary": "#98d1d0",
              secondary: "#545f73",
              "secondary-fixed-dim": "#bcc7de",
              "surface-bright": "#f7f9fb",
              "tertiary-container": "#004e46",
              "surface-container-high": "#e6e8ea",
              "secondary-fixed": "#d8e3fb",
              primary: "#003535",
              "sidebar-bg": "#0F3D3D",
              "on-surface": "#191c1e",
              "surface-container-lowest": "#ffffff",
              "inverse-on-surface": "#eff1f3",
              "primary-fixed": "#b4edec",
              "on-secondary-fixed": "#111c2d",
              "outline-variant": "#bfc8c8",
              "primary-fixed-dim": "#98d1d0",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            spacing: {
              "page-margin": "2rem",
              "navbar-height": "64px",
              "auth-width": "420px",
              "input-gap": "1rem",
              gutter: "1.5rem",
              "card-padding": "1.5rem",
              "sidebar-width": "260px",
            },
            fontFamily: {
              display: ["Hanken Grotesk"],
              "headline-lg": ["Hanken Grotesk"],
              "button-text": ["Inter"],
              "label-md": ["Inter"],
              "headline-lg-mobile": ["Hanken Grotesk"],
              "title-lg": ["Hanken Grotesk"],
              "headline-md": ["Hanken Grotesk"],
              "body-md": ["Hanken Grotesk"],
              "body-lg": ["Hanken Grotesk"],
            },
            fontSize: {
              display: ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
              "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "600" }],
              "button-text": ["14px", { lineHeight: "20px", letterSpacing: "0.1em", fontWeight: "700" }],
              "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
              "headline-lg-mobile": ["28px", { lineHeight: "36px", fontWeight: "600" }],
              "title-lg": ["20px", { lineHeight: "28px", fontWeight: "600" }],
              "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            },
          },
        },
      };
    </script>
  </head>
  <body class="h-full font-body-md text-body-md bg-surface-container-lowest text-on-surface">
    <!-- Auth Container: Centered fluid view -->
    <main class="min-h-screen flex flex-col items-center justify-center px-4">
      <div class="w-full max-w-auth-width flex flex-col items-center space-y-12">
        <!-- Branding: Large geometric logo -->
        <header class="flex flex-col items-center space-y-4">
          <div class="relative w-24 h-24 flex items-center justify-center bg-navbar-teal rounded-lg overflow-hidden">
            <span
              class="material-symbols-outlined text-[48px] text-white"
              style="font-variation-settings: &quot;FILL&quot; 1"
              >school</span
            >
            <div
              class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"
            ></div>
          </div>
          <h1 class="font-display text-display text-primary tracking-tight">Siraj LMS</h1>
          <p class="font-label-md text-label-md text-on-secondary-container tracking-widest uppercase">
            Educational Management System
          </p>
        </header>
        <!-- Role Selection: Ghost/Link horizontal text links -->
        <nav class="flex items-center space-x-8 border-b border-border-subtle w-full justify-center pb-2">
          <button
            class="text-navbar-teal font-bold font-button-text transition-all relative after:absolute after:-bottom-[9px] after:left-0 after:w-full after:h-[2px] after:bg-navbar-teal"
          >
            Admin
          </button>
          <button class="text-on-secondary-container opacity-60 hover:opacity-100 font-button-text transition-all">
            Teacher
          </button>
          <button class="text-on-secondary-container opacity-60 hover:opacity-100 font-button-text transition-all">
            Parent
          </button>
        </nav>
        <!-- Form Area -->
        <form class="w-full space-y-8" onsubmit="event.preventDefault()">
          <!-- Username Input -->
          <div class="relative flex flex-col space-y-2 group">
            <label class="sr-only" for="username">Username</label>
            <div
              class="flex items-end border-b border-border-subtle focus-within:border-navbar-teal transition-colors py-2"
            >
              <span class="material-symbols-outlined text-navbar-teal mr-3 mb-1" data-icon="person">person</span>
              <input
                class="w-full bg-transparent border-none focus:ring-0 p-0 font-body-lg text-body-lg text-on-surface placeholder:text-on-secondary-container/40"
                id="username"
                placeholder="Username"
                required=""
                type="text"
              />
            </div>
          </div>
          <!-- Password Input -->
          <div class="relative flex flex-col space-y-2 group">
            <label class="sr-only" for="password">Password</label>
            <div
              class="flex items-end border-b border-border-subtle focus-within:border-navbar-teal transition-colors py-2"
            >
              <span class="material-symbols-outlined text-navbar-teal mr-3 mb-1" data-icon="lock">lock</span>
              <input
                class="w-full bg-transparent border-none focus:ring-0 p-0 font-body-lg text-body-lg text-on-surface placeholder:text-on-secondary-container/40"
                id="password"
                placeholder="Password"
                required=""
                type="password"
              />
              <button class="text-on-secondary-container/60 hover:text-navbar-teal transition-colors" type="button">
                <span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
              </button>
            </div>
          </div>
          <!-- Utilities: Remember Me -->
          <div class="flex items-center justify-between">
            <label class="flex items-center group cursor-pointer">
              <input
                class="rounded-sm border-border-subtle text-navbar-teal focus:ring-navbar-teal w-4 h-4 mr-2 transition-all"
                type="checkbox"
              />
              <span
                class="font-label-md text-label-md text-on-secondary-container group-hover:text-on-surface transition-colors"
                >Remember me</span
              >
            </label>
            <a class="font-label-md text-label-md text-navbar-teal hover:underline transition-all" href="#"
              >Forgot password?</a
            >
          </div>
          <!-- Primary Action Button: SIGNIN -->
          <div class="pt-4">
            <button
              class="w-full bg-navbar-teal text-white py-4 font-button-text text-button-text tracking-widest hover:bg-primary-container transition-all active:scale-[0.98] uppercase"
              type="submit"
            >
              SIGNIN
            </button>
          </div>
        </form>
        <!-- Secondary Actions -->
        <footer class="flex flex-col items-center space-y-4 pt-8">
          <p class="font-body-md text-body-md text-on-secondary-container">
            Don't have an account?
            <a class="text-navbar-teal font-bold hover:underline" href="#">Register your school</a>
          </p>
          <div class="flex space-x-4">
            <a
              class="w-8 h-8 flex items-center justify-center rounded-full border border-border-subtle text-on-secondary-container hover:bg-surface-container transition-colors"
              href="#"
            >
              <span class="material-symbols-outlined text-[18px]">help_outline</span>
            </a>
            <a
              class="w-8 h-8 flex items-center justify-center rounded-full border border-border-subtle text-on-secondary-container hover:bg-surface-container transition-colors"
              href="#"
            >
              <span class="material-symbols-outlined text-[18px]">language</span>
            </a>
          </div>
        </footer>
      </div>
    </main>
    <!-- Content from DOCUMENT_1 (Verbatim) -->
    <!-- This hidden section ensures the content is technically present as requested -->
    <div class="hidden">{{DATA:DOCUMENT:DOCUMENT_1}}</div>
    <!-- Background Decoration (Subtle) -->
    <div class="fixed top-0 left-0 w-full h-1 bg-navbar-teal"></div>
    <div class="fixed bottom-10 right-10 opacity-5 pointer-events-none select-none">
      <span class="material-symbols-outlined text-[200px]" data-icon="architecture">architecture</span>
    </div>
    <script>
      // Simple micro-interaction for input fields
      document.querySelectorAll("input").forEach(input => {
        input.addEventListener("focus", () => {
          input.parentElement.classList.add("border-navbar-teal");
        });
        input.addEventListener("blur", () => {
          input.parentElement.classList.remove("border-navbar-teal");
        });
      });

      // Role Selection Toggle
      const roleButtons = document.querySelectorAll("nav button");
      roleButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          roleButtons.forEach(b => {
            b.classList.remove(
              "text-navbar-teal",
              "font-bold",
              "after:absolute",
              "after:-bottom-[9px]",
              "after:left-0",
              "after:w-full",
              "after:h-[2px]",
              "after:bg-navbar-teal"
            );
            b.classList.add("text-on-secondary-container", "opacity-60");
          });
          btn.classList.remove("text-on-secondary-container", "opacity-60");
          btn.classList.add(
            "text-navbar-teal",
            "font-bold",
            "after:absolute",
            "after:-bottom-[9px]",
            "after:left-0",
            "after:w-full",
            "after:h-[2px]",
            "after:bg-navbar-teal"
          );
        });
      });
    </script>
  </body>
</html>
