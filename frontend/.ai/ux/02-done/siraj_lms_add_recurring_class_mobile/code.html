<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Siraj LMS - Add Recurring Class</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link

    <link

    <link

      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-fixed": "#b4edec",

              "on-background": "#191c1e",

              "on-secondary-container": "#586377",
              "text-muted": "#64748B",
              "primary-fixed-dim": "#98d1d0",
              "surface-container": "#eceef0",
              "navbar-teal": "#135E5E",
              "on-secondary-fixed-variant": "#3c475a",
              "secondary-fixed-dim": "#bcc7de",
              surface: "#f7f9fb",
              "inverse-primary": "#98d1d0",
              "inverse-on-surface": "#eff1f3",
              outline: "#707978",
              "tertiary-container": "#004e46",
              "outline-variant": "#bfc8c8",
              "border-subtle": "#E2E8F0",
              "on-tertiary-fixed": "#00201c",
              "on-secondary": "#ffffff",
              "on-primary-container": "#85bdbc",
              "on-surface-variant": "#404848",
              error: "#ba1a1a",
              "surface-container-highest": "#e0e3e5",
              "surface-dim": "#d8dadc",
              "on-tertiary": "#ffffff",
              "tertiary-fixed-dim": "#4fdbc8",
              "on-tertiary-fixed-variant": "#005048",
              "on-primary": "#ffffff",
              "on-error": "#ffffff",
              "tertiary-fixed": "#71f8e4",
              "on-error-container": "#93000a",
              secondary: "#545f73",
              "sidebar-bg": "#0F3D3D",
              "on-primary-fixed": "#002020",
              "error-container": "#ffdad6",
              "surface-bright": "#f7f9fb",
              background: "#f7f9fb",
              primary: "#003535",
              "secondary-fixed": "#d8e3fb",
              "on-surface": "#191c1e",
              "surface-variant": "#e0e3e5",
              "surface-container-low": "#f2f4f6",
              "secondary-container": "#d5e0f8",
              "on-tertiary-container": "#33c7b4",
              "on-secondary-fixed": "#111c2d",
              "on-primary-fixed-variant": "#104f4f",
              "inverse-surface": "#2d3133",
              "surface-tint": "#2e6767",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            spacing: {
              gutter: "1.5rem",
              "card-padding": "1.5rem",
              "input-gap": "1rem",
              "navbar-height": "64px",
              "auth-width": "420px",
              "sidebar-width": "260px",
              "page-margin": "2rem",
            },
            fontFamily: {
              "headline-md": ["Hanken Grotesk"],
              display: ["Hanken Grotesk"],
              "headline-lg": ["Hanken Grotesk"],
              "body-md": ["Hanken Grotesk"],
              "button-text": ["Inter"],
              "body-lg": ["Hanken Grotesk"],
              "title-lg": ["Hanken Grotesk"],
              "label-md": ["Inter"],
              "headline-lg-mobile": ["Hanken Grotesk"],
              "headline-md-mobile": ["Hanken Grotesk"],

            fontSize: {
              "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
              display: ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
              "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "600" }],

              "headline-md-mobile": ["20px", { lineHeight: "28px", fontWeight: "600" }],

    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }
      body {
        font-family: "Hanken Grotesk", sans-serif;
        background-color: #f7f9fb;
      }
      .custom-checkbox {
        appearance: none;
        width: 20px;
        height: 20px;
        border: 2px solid #bfc8c8;
        border-radius: 4px;
        outline: none;
        cursor: pointer;
        position: relative;
      }
      .custom-checkbox:checked {
        background-color: #135e5e;
        border-color: #135e5e;
      }
      .custom-checkbox:checked::after {
        content: "check";
        font-family: "Material Symbols Outlined";
        font-size: 16px;
        color: white;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .scroll-container {
        height: calc(100vh - 144px);
        overflow-y: auto;
        padding-bottom: 80px;
      }
      .toast-animation {
        animation: slideUp 0.3s ease-out forwards;
      }
      @keyframes slideUp {
        from {
          transform: translate(-50%, 100%);
          opacity: 0;
        }
        to {
          transform: translate(-50%, -24px);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="bg-background text-on-surface">
    <!-- TopAppBar -->
    <header class="fixed top-0 w-full z-50 bg-navbar-teal flex items-center h-navbar-height px-4 w-full">
      <div class="flex items-center w-full">
        <button
          class="mr-4 text-on-primary active:opacity-80 transition-opacity flex items-center justify-center p-2 rounded-full hover:bg-primary-container/20"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
        <h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-on-primary">Add Recurring Class</h1>
      </div>
    </header>
    <!-- Main Content Area -->
    <main class="mt-navbar-height scroll-container px-4 py-6">
      <div class="space-y-6">
        <!-- Student Selection -->
        <section class="space-y-2">
          <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider block"
            >Students</label
          >
          <div class="relative">
            <select
              class="w-full bg-surface border border-outline-variant rounded-xl px-4 py-3 appearance-none focus:ring-2 focus:ring-navbar-teal focus:border-navbar-teal text-body-lg font-body-lg"
            >
              <option>Select Student</option>
              <option>Ahmed Khan</option>
              <option>Sara Williams</option>
            </select>
            <span
              class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none"
              >expand_more</span
            >
          </div>
        </section>
        <!-- Time & Duration Section -->
        <section class="grid grid-cols-2 gap-4">
          <div class="col-span-2 space-y-2">
            <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider block"
              >Default Start Time</label
            >
            <div class="relative">
              <input
                class="w-full bg-surface border border-outline-variant rounded-xl px-4 py-3 pl-11 focus:ring-2 focus:ring-navbar-teal focus:border-navbar-teal text-body-lg font-body-lg"
                type="text"
                value="09:00 AM"
              />
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-navbar-teal"
                style="font-variation-settings: &quot;FILL&quot; 1"
                >schedule</span
              >
            </div>
          </div>
          <div class="space-y-2">
            <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider block"
              >Duration (Hrs)</label
            >
            <input
              class="w-full bg-surface border border-outline-variant rounded-xl px-4 py-3 focus:ring-2 focus:ring-navbar-teal focus:border-navbar-teal text-body-lg font-body-lg text-center"
              type="number"
              value="1"
            />
          </div>
          <div class="space-y-2">
            <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider block"
              >Duration (Mins)</label
            >
            <input
              class="w-full bg-surface border border-outline-variant rounded-xl px-4 py-3 focus:ring-2 focus:ring-navbar-teal focus:border-navbar-teal text-body-lg font-body-lg text-center"
              type="number"
              value="30"
            />
          </div>
        </section>
        <!-- Days Selection List -->
        <section class="space-y-3">
          <label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider block mb-4"
            >Class Schedule</label
          >
          <!-- Monday -->
          <div
            class="bg-surface-container-lowest border border-border-subtle rounded-xl p-4 flex items-center justify-between shadow-sm"
          >
            <div class="flex items-center gap-4">
              <input checked="" class="custom-checkbox" type="checkbox" />
              <span class="font-title-lg text-title-lg text-on-surface">Monday</span>
            </div>
            <button
              class="text-on-secondary-container p-2 rounded-full hover:bg-surface-container-high transition-colors"
            >
              <span class="material-symbols-outlined">tune</span>
            </button>
          </div>
          <!-- Tuesday -->
          <div
            class="bg-surface-container-lowest border border-border-subtle rounded-xl p-4 flex items-center justify-between shadow-sm"
          >
            <div class="flex items-center gap-4">
              <input checked="" class="custom-checkbox" type="checkbox" />
              <span class="font-title-lg text-title-lg text-on-surface">Tuesday</span>
            </div>
            <button
              class="text-on-secondary-container p-2 rounded-full hover:bg-surface-container-high transition-colors"
            >
              <span class="material-symbols-outlined">tune</span>
            </button>
          </div>
          <!-- Wednesday -->
          <div
            class="bg-surface-container-lowest border border-border-subtle rounded-xl p-4 flex items-center justify-between shadow-sm"
          >
            <div class="flex items-center gap-4">
              <input checked="" class="custom-checkbox" type="checkbox" />
              <span class="font-title-lg text-title-lg text-on-surface">Wednesday</span>
            </div>
            <button
              class="text-on-secondary-container p-2 rounded-full hover:bg-surface-container-high transition-colors"
            >
              <span class="material-symbols-outlined">tune</span>
            </button>
          </div>
          <!-- Thursday (Active Override) -->
          <div class="bg-surface-container-lowest border-2 border-navbar-teal rounded-xl p-4 shadow-md space-y-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-4">
                <input checked="" class="custom-checkbox" type="checkbox" />
                <span class="font-title-lg text-title-lg text-navbar-teal font-bold">Thursday</span>
              </div>
              <button class="bg-navbar-teal text-on-primary p-2 rounded-full transition-colors">
                <span class="material-symbols-outlined">tune</span>
              </button>
            </div>
            <div class="bg-surface border border-outline-variant rounded-lg p-3 flex items-center gap-3">
              <span
                class="material-symbols-outlined text-navbar-teal"
                style="font-variation-settings: &quot;FILL&quot; 1"
                >event_repeat</span
              >
              <div class="flex-1">
                <p class="text-label-md font-label-md text-on-surface-variant">TIME OVERRIDE</p>
                <input
                  class="w-full bg-transparent border-none p-0 text-title-lg font-title-lg text-on-surface focus:ring-0"
                  type="text"
                  value="01:30 PM"
                />
              </div>
              <span class="material-symbols-outlined text-on-surface-variant">schedule</span>
            </div>
          </div>
          <!-- Friday -->
          <div
            class="bg-surface-container-lowest border border-border-subtle rounded-xl p-4 flex items-center justify-between shadow-sm"
          >
            <div class="flex items-center gap-4">
              <input checked="" class="custom-checkbox" type="checkbox" />
              <span class="font-title-lg text-title-lg text-on-surface">Friday</span>
            </div>
            <button
              class="text-on-secondary-container p-2 rounded-full hover:bg-surface-container-high transition-colors"
            >
              <span class="material-symbols-outlined">tune</span>
            </button>
          </div>
          <!-- Saturday (Weekend Off) -->
          <div
            class="bg-surface-dim opacity-60 border border-outline-variant rounded-xl p-4 flex items-center justify-between"
          >
            <div class="flex items-center gap-4">
              <input class="custom-checkbox border-on-surface-variant/30" disabled="" type="checkbox" />
              <span class="font-title-lg text-title-lg text-on-surface-variant">Saturday</span>
            </div>
            <span class="text-label-md font-label-md text-on-surface-variant font-bold">WEEKEND OFF</span>
          </div>
          <!-- Sunday (Weekend Off) -->
          <div
            class="bg-surface-dim opacity-60 border border-outline-variant rounded-xl p-4 flex items-center justify-between"
          >
            <div class="flex items-center gap-4">
              <input class="custom-checkbox border-on-surface-variant/30" disabled="" type="checkbox" />
              <span class="font-title-lg text-title-lg text-on-surface-variant">Sunday</span>
            </div>
            <span class="text-label-md font-label-md text-on-surface-variant font-bold">WEEKEND OFF</span>
          </div>
        </section>
      </div>
    </main>
    <!-- Success Notification Toast -->
    <div class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[60] toast-animation" id="successToast">
      <div class="bg-navbar-teal text-on-primary px-6 py-3 rounded-full flex items-center gap-3 shadow-2xl">
        <span
          class="material-symbols-outlined bg-white/20 rounded-full p-1"
          style="font-variation-settings: &quot;wght&quot; 700"
          >check</span
        >
        <span class="font-button-text text-button-text whitespace-nowrap">ADDED SUCCESSFULLY</span>
      </div>
    </div>
    <!-- Fixed Footer Button -->
    <footer class="fixed bottom-0 w-full z-50 bg-surface px-4 py-4 border-t border-border-subtle flex justify-center">
      <button
        class="w-full max-w-md bg-navbar-teal text-on-primary h-14 rounded-full font-button-text text-button-text flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-lg"
        id="addBtn"
      >
        ADD CLASS
        <span class="material-symbols-outlined">add</span>
      </button>
    </footer>
    <script>
      // Simple micro-interaction for the Add button
      const addBtn = document.getElementById("addBtn");
      const toast = document.getElementById("successToast");

      // Hide toast by default after animation
      setTimeout(() => {
        toast.style.display = "none";
      }, 3000);

      addBtn.addEventListener("click", () => {
        toast.style.display = "flex";
        toast.classList.remove("toast-animation");
        void toast.offsetWidth; // Trigger reflow
        toast.classList.add("toast-animation");

        setTimeout(() => {
          toast.style.display = "none";
        }, 3000);
      });
    </script>
  </body>
</html>
