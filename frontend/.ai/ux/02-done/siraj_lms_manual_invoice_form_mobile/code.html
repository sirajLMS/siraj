<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Create Invoice | Siraj LMS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Hanken+Grotesk:wght@400;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-fixed-dim": "#4fdbc8",
              "on-secondary-fixed": "#111c2d",
              "primary-fixed-dim": "#98d1d0",
              "on-tertiary-fixed-variant": "#005048",
              "primary-container": "#0d4d4d",
              "surface-container-high": "#e6e8ea",
              outline: "#707978",
              "tertiary-container": "#004e46",
              "surface-variant": "#e0e3e5",
              "surface-container-low": "#f2f4f6",
              error: "#ba1a1a",
              "surface-container-highest": "#e0e3e5",
              "primary-fixed": "#b4edec",
              "on-surface": "#191c1e",
              "surface-dim": "#d8dadc",
              "surface-bright": "#f7f9fb",
              "on-secondary-container": "#586377",
              "on-primary-fixed-variant": "#104f4f",
              "on-surface-variant": "#404848",
              surface: "#f7f9fb",
              "on-error": "#ffffff",
              "on-background": "#191c1e",
              "surface-container": "#eceef0",
              "on-error-container": "#93000a",
              "inverse-surface": "#2d3133",
              "text-muted": "#64748B",
              background: "#f7f9fb",
              "border-subtle": "#E2E8F0",
              "secondary-container": "#d5e0f8",
              "on-primary-container": "#85bdbc",
              "inverse-on-surface": "#eff1f3",
              "on-secondary-fixed-variant": "#3c475a",
              "on-tertiary-fixed": "#00201c",
              "on-tertiary-container": "#33c7b4",
              "sidebar-bg": "#0F3D3D",
              primary: "#003535",
              "on-primary": "#ffffff",
              "error-container": "#ffdad6",
              "secondary-fixed-dim": "#bcc7de",
              "on-secondary": "#ffffff",
              secondary: "#545f73",
              "surface-tint": "#2e6767",
              "on-tertiary": "#ffffff",
              "tertiary-fixed": "#71f8e4",
              tertiary: "#00352f",
              "on-primary-fixed": "#002020",
              "inverse-primary": "#98d1d0",
              "outline-variant": "#bfc8c8",
              "surface-container-lowest": "#ffffff",
              "secondary-fixed": "#d8e3fb",
              "navbar-teal": "#135E5E",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            spacing: {
              "input-gap": "1rem",
              gutter: "1.5rem",
              "page-margin": "2rem",
              "sidebar-width": "260px",
              "navbar-height": "64px",
              "auth-width": "420px",
              "card-padding": "1.5rem",
            },
            fontFamily: {
              "label-md": ["Inter"],
              display: ["Hanken Grotesk"],
              "title-lg": ["Hanken Grotesk"],
              "headline-lg": ["Hanken Grotesk"],
              "button-text": ["Inter"],
              "body-md": ["Hanken Grotesk"],
              "headline-md": ["Hanken Grotesk"],
              "headline-lg-mobile": ["Hanken Grotesk"],
              "body-lg": ["Hanken Grotesk"],
            },
            fontSize: {
              "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
              display: ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
              "title-lg": ["20px", { lineHeight: "28px", fontWeight: "600" }],
              "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "600" }],
              "button-text": ["14px", { lineHeight: "20px", letterSpacing: "0.1em", fontWeight: "700" }],
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
              "headline-lg-mobile": ["28px", { lineHeight: "36px", fontWeight: "600" }],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      body {
        background-color: #f8fafc;
      }
      .form-underline {
        border-bottom: 1px solid #e2e8f0;
      }
      .form-underline:focus-within {
        border-bottom: 2px solid #135e5e;
      }
      .month-chip input:checked + label {
        background-color: #0d4d4d;
        color: #ffffff;
        border-color: #0d4d4d;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="font-body-md text-on-surface">
    <!-- TopAppBar -->
    <header class="fixed top-0 w-full z-50 bg-navbar-teal shadow-sm flex items-center h-navbar-height px-4 w-full">
      <button
        class="mr-4 text-on-primary hover:bg-primary-container/20 p-2 rounded-full transition-colors duration-200"
      >
        <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
      </button>
      <h1 class="font-title-lg text-title-lg font-bold text-on-primary">Create Invoice</h1>
    </header>
    <!-- Main Content Canvas -->
    <main class="pt-20 pb-32 px-4 max-w-md mx-auto">
      <header class="mb-8">
        <p class="font-body-lg text-body-lg text-on-surface-variant">
          Generate one-off fee records for institutional billing.
        </p>
      </header>
      <section class="space-y-6">
        <!-- Parent Selection -->
        <div class="bg-surface-container-lowest rounded-xl p-card-padding shadow-sm">
          <label class="font-label-md text-label-md text-on-surface-variant block mb-2">PARENT SELECTION</label>
          <div class="flex items-center form-underline py-2">
            <span class="material-symbols-outlined text-primary mr-3" data-icon="person_search">person_search</span>
            <input
              class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg p-0"
              placeholder="Search parent name or ID..."
              type="text"
            />
          </div>
        </div>
        <!-- Fee Amount -->
        <div class="bg-surface-container-lowest rounded-xl p-card-padding shadow-sm">
          <label class="font-label-md text-label-md text-on-surface-variant block mb-2">FEE AMOUNT</label>
          <div class="flex items-center form-underline py-2">
            <span class="font-title-lg text-title-lg text-primary mr-3 font-bold">AED</span>
            <input
              class="w-full bg-transparent border-none focus:ring-0 font-display text-display p-0 h-12"
              id="amount-input"
              placeholder="0.00"
              type="number"
            />
          </div>
        </div>
        <!-- Dates -->
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-surface-container-lowest rounded-xl p-card-padding shadow-sm">
            <label class="font-label-md text-label-md text-on-surface-variant block mb-2">ISSUE DATE</label>
            <div class="flex items-center form-underline py-1">
              <span class="material-symbols-outlined text-primary text-lg mr-2" data-icon="calendar_today"
                >calendar_today</span
              >
              <input class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md p-0" type="date" />
            </div>
          </div>
          <div class="bg-surface-container-lowest rounded-xl p-card-padding shadow-sm">
            <label class="font-label-md text-label-md text-on-surface-variant block mb-2">DUE DATE</label>
            <div class="flex items-center form-underline py-1">
              <span class="material-symbols-outlined text-primary text-lg mr-2" data-icon="event_busy">event_busy</span>
              <input class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md p-0" type="date" />
            </div>
          </div>
        </div>
        <!-- Multi-Month Selector -->
        <div class="bg-surface-container-lowest rounded-xl p-card-padding shadow-sm">
          <label class="font-label-md text-label-md text-on-surface-variant block mb-4 uppercase"
            >Billing Period (Months)</label
          >
          <div class="grid grid-cols-3 gap-3">
            <script>
              const months = [
                "January",
                "February",
                "March",
                "April",
                "May",
                "June",
                "July",
                "August",
                "September",
                "October",
                "November",
                "December",
              ];
              months.forEach(month => {
                document.write(`
                                <div class="month-chip">
                                    <input type="checkbox" id="month-${month}" class="hidden peer" onchange="calculateSummary()">
                                    <label for="month-${month}" class="flex items-center justify-center border border-outline-variant rounded-lg py-2 font-label-md text-label-md text-on-surface-variant cursor-pointer peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-all">
                                        ${month.substring(0, 3).toUpperCase()}
                                    </label>
                                </div>
                            `);
              });
            </script>
          </div>
        </div>
        <!-- Summary Card -->
        <div class="bg-primary-container text-on-primary-container rounded-xl p-card-padding shadow-md">
          <div class="flex justify-between items-center">
            <div>
              <p class="font-label-md text-label-md opacity-80 uppercase">Total Draft Value</p>
              <h2 class="font-headline-md text-headline-md" id="summary-total">AED 0.00</h2>
            </div>
            <div class="h-12 w-12 rounded-full border border-on-primary-container/20 flex items-center justify-center">
              <span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
            </div>
          </div>
        </div>
        <!-- Actions -->
        <div class="space-y-3 pt-4 pb-8">
          <button
            class="w-full bg-primary text-on-primary font-button-text text-button-text h-14 rounded-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center"
          >
            SUBMIT
          </button>
          <button
            class="w-full border-2 border-primary text-primary font-button-text text-button-text h-14 rounded-lg hover:bg-primary/5 active:scale-[0.98] transition-all flex items-center justify-center"
          >
            <span class="material-symbols-outlined mr-2" data-icon="mail">mail</span>
            SUBMIT &amp; SEND EMAIL
          </button>
        </div>
      </section>
    </main>
    <!-- BottomNavBar -->
    <nav
      class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline-variant flex justify-around items-center h-16 w-full"
    >
      <a
        class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-transform"
        href="#"
      >
        <span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
        <span class="font-label-md text-label-md">Dashboard</span>
      </a>
      <a
        class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-transform"
        href="#"
      >
        <span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
        <span class="font-label-md text-label-md">Invoices</span>
      </a>
      <a
        class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-transform"
        href="#"
      >
        <span class="material-symbols-outlined" data-icon="group">group</span>
        <span class="font-label-md text-label-md">Students</span>
      </a>
      <a
        class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-transform"
        href="#"
      >
        <span class="material-symbols-outlined" data-icon="settings">settings</span>
        <span class="font-label-md text-label-md">Settings</span>
      </a>
    </nav>
    <script>
      function calculateSummary() {
        const amountInput = document.getElementById("amount-input");
        const amount = parseFloat(amountInput.value) || 0;
        const checkedMonths = document.querySelectorAll(".month-chip input:checked").length;
        const total = amount * (checkedMonths || 1); // If no month selected, assume single month or factor 1

        document.getElementById("summary-total").innerText =
          `AED ${total.toLocaleString("en-US", { minimumFractionDigits: 2 })}`;
      }

      document.getElementById("amount-input").addEventListener("input", calculateSummary);

      // Visual feedback for interactions
      const buttons = document.querySelectorAll("button");
      buttons.forEach(btn => {
        btn.addEventListener("touchstart", function () {
          this.style.opacity = "0.7";
        });
        btn.addEventListener("touchend", function () {
          this.style.opacity = "1";
        });
      });
    </script>
  </body>
</html>
