sonar.projectKey=siraj
sonar.projectName=LMS
sonar.projectVersion=1.0

# Source code
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Performance
# Inclusions / Scope
sonar.inclusions=app/**,backend/**,frontend/**,shared/**,scripts/**

# Performance / Memory tuning
sonar.javascript.node.maxspace=8192
sonar.javascript.environments=node,browser

# Exclusions
# Ignore ALL dot-directories (**/.**/**, **/.*/**), node_modules, build outputs, generated files, & draft directories
sonar.exclusions=**/.*/**,**/.**/**,**/node_modules/**,node_modules/**,**/dist/**,dist/**,**/out/**,out/**,**/build/**,build/**,**/coverage/**,**/draft/**,draft/**,**/unRefactored_tests/**,**/frontend/common/graphql/generated/**,**/graphql/generated/**,**/messages/**,**theme/palette/**,docs/**,backend/drizzle/**,**/*.stories.@(js|jsx|ts|tsx),**/*.test.@(js|jsx|ts|tsx),**/__tests__/**,**/*.d.ts,**/public/**,**/scripts/**,**/mockData/**,**/decorators/**,storybook-static/**

# TypeScript/JavaScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# SCM settings - scan working directory including uncommitted changes
sonar.scm.disabled=true

# Caching
sonar.analysisCache.enabled=true

sonar.issue.ignore.multicriteria=1

# Specify the rule you want to disable (RepositoryKey:RuleKey)
sonar.issue.ignore.multicriteria.1.ruleKey=typescript:S3358,typescript:S1481

# Apply the exclusion to all files in the project
sonar.issue.ignore.multicriteria.1.resourceKey=*