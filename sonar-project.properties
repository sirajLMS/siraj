sonar.projectKey=siraj
sonar.projectName=LMS
sonar.projectVersion=1.0

# Source code
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=docs/**,backend/drizzle/**,**/node_modules/**,**/.next/**,**/dist/**,**/out/**,**/build/**,**/.storybook/**,**/*.stories.@(js|jsx|ts|tsx),**/*.test.@(js|jsx|ts|tsx),**/__tests__/**,**/*.d.ts,**/public/**,**/coverage/**,**/scripts/**,**/mockData/**,**/decorators/**,**/graphql/generated/**

# TypeScript/JavaScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# SCM settings - scan working directory including uncommitted changes
sonar.scm.disabled=true
