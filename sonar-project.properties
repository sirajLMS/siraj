sonar.projectKey=siraj
sonar.projectName=LMS
sonar.projectVersion=1.0

# Source code
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Performance
sonar.javascript.node.maxspace=4096

# Exclusions
sonar.exclusions=**/messages/**,**theme/palette/**,**/.scannerwork/**,**/.git/**,**/.agent/**,**/.ai/**,docs/**,backend/drizzle/**,**/node_modules/**,**/.next/**,**/dist/**,**/out/**,**/build/**,**/.storybook/**,**/*.stories.@(js|jsx|ts|tsx),**/*.test.@(js|jsx|ts|tsx),**/__tests__/**,**/*.d.ts,**/public/**,**/coverage/**,**/scripts/**,**/mockData/**,**/decorators/**,**/graphql/generated/**,storybook-static/**

# TypeScript/JavaScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# SCM settings - scan working directory including uncommitted changes
sonar.scm.disabled=true

# Caching
sonar.analysisCache.enabled=true

sonar.issue.ignore.multicriteria=1

# Specify the rule you want to disable (RepositoryKey:RuleKey)
sonar.issue.ignore.multicriteria.1.ruleKey=typescript:S3358

# Apply the exclusion to all files in the project
sonar.issue.ignore.multicriteria.1.resourceKey=*