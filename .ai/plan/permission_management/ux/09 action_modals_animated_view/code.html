<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Abyssal Enterprise - Modals</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-error-container": "#ffdad6",
                        "info": "#B4C5FF",
                        "tertiary-fixed-dim": "#d5bdeb",
                        "surface-tint": "#98d1d0",
                        "secondary-fixed-dim": "#bcc7de",
                        "surface-bright": "#373a3a",
                        "primary-fixed": "#b3edec",
                        "error": "#FFB4AB",
                        "on-background": "#e1e3e2",
                        "surface-container": "#1D2020",
                        "primary-container": "#98d1d0",
                        "outline": "#899292",
                        "primary": "#b4edec",
                        "surface-variant": "#323535",
                        "error-container": "#93000a",
                        "inverse-primary": "#2e6767",
                        "surface-container-high": "#282A2A",
                        "secondary-fixed": "#d8e3fa",
                        "tertiary-fixed": "#efdbff",
                        "sidebar": "#002626",
                        "warning": "#FFBA46",
                        "secondary": "#bcc7de",
                        "tertiary-container": "#d5bdeb",
                        "on-primary-container": "#205b5b",
                        "on-surface-variant": "#bfc8c7",
                        "on-tertiary": "#3a284d",
                        "surface-dim": "#111414",
                        "on-secondary-container": "#aab5cc",
                        "inverse-on-surface": "#2e3131",
                        "primary-fixed-dim": "#98d1d0",
                        "on-secondary-fixed-variant": "#3c475a",
                        "on-primary": "#003737",
                        "surface": "#111414",
                        "outline-variant": "#404848",
                        "success": "#62DF7D",
                        "completed": "#DDB8FF",
                        "on-tertiary-container": "#5d4a71",
                        "surface-container-highest": "#323535",
                        "header-container": "#135E5E",
                        "surface-container-lowest": "#0c0f0f",
                        "on-error": "#690005",
                        "on-tertiary-fixed-variant": "#513f65",
                        "inverse-surface": "#e1e3e2",
                        "on-primary-fixed-variant": "#0f4f4f",
                        "surface-container-low": "#191c1c",
                        "on-tertiary-fixed": "#241337",
                        "background": "#111414",
                        "on-secondary": "#263143",
                        "on-surface": "#e1e3e2",
                        "on-primary-fixed": "#002020",
                        "tertiary": "#efdbff",
                        "secondary-container": "#3c475a",
                        "on-secondary-fixed": "#111c2d"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    spacing: {
                        "container-padding": "16px",
                        "grid-margin": "24px",
                        "grid-gutter": "16px",
                        "unit": "4px",
                        "cell-padding-y": "8px",
                        "cell-padding-x": "12px"
                    },
                    fontFamily: {
                        "headline-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "title-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "body-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    fontSize: {
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "label-sm": ["11px", { lineHeight: "16px", letterSpacing: "0.5px", fontWeight: "500" }],
                        "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.5px", fontWeight: "500" }],
                        "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
                        "title-lg": ["18px", { lineHeight: "24px", fontWeight: "600" }],
                        "title-md": ["16px", { lineHeight: "24px", fontWeight: "500" }],
                        "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.1px", fontWeight: "500" }],
                        "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }]
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        scaleUp: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' }
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 8px rgba(152,209,208,0.2)' },
                            '50%': { boxShadow: '0 0 16px rgba(152,209,208,0.6)' }
                        },
                        heartbeat: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '15%': { transform: 'scale(1.15)' },
                            '30%': { transform: 'scale(1)' },
                            '45%': { transform: 'scale(1.15)' },
                            '60%': { transform: 'scale(1)' }
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'scale-up': 'scaleUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'scale-up-delayed': 'scaleUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'heartbeat': 'heartbeat 1.5s ease-in-out infinite'
                    }
                }
            }
        };
    </script>
<style>body {
    font-family: "Inter", sans-serif;
    background-color: #111414;
    color: #e1e3e2
    }
/* Simulating the background dashboard blur */
.scrim-bg {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuD1a25q5kD7rlCX1Qrd6J30h3PLYTF4iSh267ZzUp2LNxpQvZKGb16MN5vZmhpAlEhtTofdddj9U7_gV9cJrjMPzHws1iogFHZx6PC83WF7MrHmPRjzAFExEc2ZMEiO4gmBaXJu31H6C2jEmcCeaHTuxLKgtDDtUnVQ7r9lfmxEjCI1tDxURzaRcl573eegxWVuBUP29QEmFvKIb3U0mI2lGe2SbCZY8vVAas9FazxszI2kinfQIJ-qdx_Ul4xvIyp4bGWgx4b8_sg);
    background-size: cover;
    background-position: center
    }</style>
</head>
<body class="antialiased min-h-screen relative flex items-center justify-center p-grid-margin gap-grid-margin scrim-bg" data-alt="A blurred background showing a complex, dark-mode enterprise administrative dashboard. The interface features data grids, teal and cyan accents, and dense information displays, reflecting a high-tech, secure software environment, providing context for modal overlays.">
<!-- Scrim overlay -->
<div class="absolute inset-0 bg-surface/80 backdrop-blur-sm z-0 opacity-0 motion-safe:animate-fade-in motion-reduce:opacity-100"></div>
<!-- Modal 1: Create Permission Group -->
<div class="relative z-10 w-full max-w-md bg-surface-container border border-outline-variant rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.4)] flex flex-col opacity-0 motion-safe:animate-scale-up motion-reduce:opacity-100">
<!-- Header -->
<div class="px-container-padding py-4 border-b border-outline-variant flex justify-between items-center bg-surface-container-high rounded-t-xl">
<h2 class="font-title-lg text-title-lg text-on-surface">Create Permission Group</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-all duration-200 active:scale-95">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Body -->
<div class="p-container-padding flex flex-col gap-4">
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface-variant" for="groupName">Group Name <span class="text-error">*</span></label>
<input class="w-full bg-surface border-2 border-primary rounded-DEFAULT px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-0 focus:border-primary shadow-[0_0_8px_rgba(152,209,208,0.2)] focus:motion-safe:animate-pulse-glow" id="groupName" placeholder="Enter group name" type="text" value="Data Analysts">
</div>
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface-variant" for="description">Description (Optional)</label>
<textarea class="w-full bg-surface border border-outline rounded-DEFAULT px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary transition-colors resize-none" id="description" placeholder="Brief description of the group's purpose..." rows="3"></textarea>
</div>
</div>
<!-- Footer -->
<div class="px-container-padding py-4 border-t border-outline-variant flex justify-end gap-3 bg-surface-container-high rounded-b-xl">
<button class="px-4 py-2 border border-outline text-on-surface font-label-lg text-label-lg rounded-DEFAULT hover:bg-surface-variant transition-all duration-200 active:scale-95">
                Cancel
            </button>
<button class="px-4 py-2 bg-primary text-on-primary font-label-lg text-label-lg rounded-DEFAULT hover:bg-primary-fixed transition-all duration-200 active:scale-95">
                Save Group
            </button>
</div>
</div>
<!-- Modal 2: Confirm Bulk Action -->
<div class="relative z-10 w-full max-w-sm bg-surface-container border border-outline-variant rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.4)] flex flex-col opacity-0 motion-safe:animate-scale-up-delayed motion-reduce:opacity-100">
<!-- Header -->
<div class="px-container-padding py-4 border-b border-outline-variant flex justify-between items-center bg-surface-container-high rounded-t-xl">
<h2 class="font-title-lg text-title-lg text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-warning motion-safe:animate-heartbeat" data-icon="warning">warning</span>
                Confirm Action
            </h2>
<button class="text-on-surface-variant hover:text-on-surface transition-all duration-200 active:scale-95">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Body -->
<div class="p-container-padding flex flex-col gap-4">
<p class="font-body-md text-body-md text-on-surface">
                Are you sure you want to remove <span class="font-bold">5 permissions</span> from the <span class="font-bold">Managers</span> group?
            </p>
<div class="bg-error-container p-3 rounded-DEFAULT flex items-start gap-3 border border-error/20">
<span class="material-symbols-outlined text-on-error-container mt-0.5" data-icon="error">error</span>
<p class="font-body-sm text-body-sm text-on-error-container leading-relaxed">
                    Users in this group will immediately lose access to these features unless granted by another group or override.
                </p>
</div>
</div>
<!-- Footer -->
<div class="px-container-padding py-4 border-t border-outline-variant flex justify-end gap-3 bg-surface-container-high rounded-b-xl">
<button class="px-4 py-2 border border-outline text-on-surface font-label-lg text-label-lg rounded-DEFAULT hover:bg-surface-variant transition-all duration-200 active:scale-95">
                Cancel
            </button>
<button class="px-4 py-2 bg-error text-on-error font-label-lg text-label-lg rounded-DEFAULT hover:bg-error/90 transition-all duration-200 active:scale-95 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="delete">delete</span>
                Confirm
            </button>
</div>
</div>
</body></html>
